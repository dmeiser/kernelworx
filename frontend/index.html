<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KernelWorx - Popcorn Sales Made Easy</title>

    <!-- Open Graph meta tags for link sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KernelWorx - Popcorn Sales Made Easy" />
    <meta property="og:description" content="Track orders, manage sellers, and generate reports for your Scouting America popcorn sale." />
    <meta property="og:url" content="https://kernelworx.app" />
    <meta property="og:image" content="https://kernelworx.app/og-image.png" />
    <meta property="og:site_name" content="KernelWorx" />

    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KernelWorx - Popcorn Sales Made Easy" />
    <meta name="twitter:description" content="Track orders, manage sellers, and generate reports for your Scouting America popcorn sale." />
    <meta name="twitter:image" content="https://kernelworx.app/og-image.png" />
    
    <!--
      CSP (#440): mirrors the CloudFront response headers policy in
      tofu/application/modules/cloudfront/response-headers.tf. img-src is
      enumerated, not wildcarded: payment QR codes load from the exports
      bucket's S3 virtual-hosted origin (presigned GET URLs), the MFA TOTP QR
      is a data: URL, and the QR upload preview uses a blob: object URL.
      connect-src carries no ws:/wss: - the app uses no WebSockets.
      The dev/prod exports buckets are named kernelworx-exports-ue1-<env>;
      keep both listed here (this meta is baked into one build for all
      environments, and the effective policy is the intersection with the
      per-environment header CSP).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob: https://kernelworx-exports-ue1-dev.s3.us-east-1.amazonaws.com https://kernelworx-exports-ue1-prod.s3.us-east-1.amazonaws.com; connect-src 'self' https://*.amazonaws.com https://*.amazoncognito.com https://api.kernelworx.app https://api.dev.kernelworx.app https://login.dev.kernelworx.app https://login.kernelworx.app;"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
