name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-shared.yml
    with:
      environment: production
      tofu-directory: tofu/application/environments/prod
      aws-role-session-name: github-actions-deploy-prod
      smoke-role-session-name: github-actions-smoke-tests-prod
      run-delete-profile-migration: true
      e2e-base-url: ${{ vars.E2E_BASE_URL_PROD }}
      e2e-base-url-var-suffix: PROD
      smoke-url-block-pattern: 'https://dev.*|http://localhost:*'
      smoke-url-block-message: 'prod smoke tests against a dev/local URL.'
      run-password-change: true
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_PROD_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_ENCRYPTION_PASSPHRASE: ${{ secrets.TF_VAR_ENCRYPTION_PASSPHRASE }}
      TF_VAR_GOOGLE_CLIENT_ID: ${{ secrets.TF_VAR_GOOGLE_CLIENT_ID }}
      TF_VAR_GOOGLE_CLIENT_SECRET: ${{ secrets.TF_VAR_GOOGLE_CLIENT_SECRET }}
      TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL_PROD }}
      TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD_PROD }}
      TEST_CONTRIBUTOR_EMAIL: ${{ secrets.TEST_CONTRIBUTOR_EMAIL_PROD }}
      TEST_CONTRIBUTOR_PASSWORD: ${{ secrets.TEST_CONTRIBUTOR_PASSWORD_PROD }}
      TEST_READONLY_EMAIL: ${{ secrets.TEST_READONLY_EMAIL_PROD }}
      TEST_READONLY_PASSWORD: ${{ secrets.TEST_READONLY_PASSWORD_PROD }}
      TEST_USER_POOL_ID: ${{ secrets.TEST_USER_POOL_ID_PROD }}
