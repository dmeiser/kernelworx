name: Temp Recover State and Teardown

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to recover and teardown"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  recover-and-teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ephemeral
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::750620721302:role/GitHubActionsKernelworxDev
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-temp-recover

      - name: Validate PR number
        run: |
          PR_NUMBER="${{ github.event.inputs.pr_number }}"
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Recover state if needed and teardown
        env:
          TF_VAR_encryption_passphrase: ${{ secrets.TF_VAR_ENCRYPTION_PASSPHRASE }}
        run: |
          set -e
          STATE_BUCKET="kernelworx-tofu-state-us-east-1-dev"
          STATE_KEY="application/ephemeral/pr-${PR_NUMBER}/terraform.tfstate"
          REGION="us-east-1"

          echo "Checking state s3://${STATE_BUCKET}/${STATE_KEY}..."
          if aws s3api head-object --bucket "$STATE_BUCKET" --key "$STATE_KEY" --region "$REGION" >/dev/null 2>&1; then
            echo "State exists; running normal teardown."
            scripts/ephemeral-env.sh down "pr-${PR_NUMBER}"
            exit 0
          fi

          echo "State missing; looking for a previous version to restore..."
          versions=$(aws s3api list-object-versions \
            --bucket "$STATE_BUCKET" \
            --prefix "$STATE_KEY" \
            --region "$REGION" \
            --query 'Versions[?IsLatest==`true`].[Key,VersionId]' \
            --output text)

          if [ -z "$versions" ]; then
            echo "❌ No previous state version found for pr-${PR_NUMBER}."
            exit 1
          fi

          latest_version=$(echo "$versions" | head -n1 | awk '{print $2}')
          echo "Restoring state version $latest_version..."
          aws s3api copy-object \
            --bucket "$STATE_BUCKET" \
            --key "$STATE_KEY" \
            --copy-source "${STATE_BUCKET}/${STATE_KEY}?versionId=${latest_version}" \
            --region "$REGION"

          echo "Running teardown..."
          scripts/ephemeral-env.sh down "pr-${PR_NUMBER}"
