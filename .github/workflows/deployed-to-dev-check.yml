name: Deployed to Dev Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  deployed-to-dev:
    name: Check PR is deployed to dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Verify that every unique commit on the PR branch is present on base/dev.
      #
      # We use `git merge-base --is-ancestor` as a fast per-commit short-circuit,
      # then fall back to `git cherry` patch-id matching for commits that were
      # cherry-picked or rebased onto dev (where the SHA differs).
      #
      # Edge case: if a PR commit was merged to dev and later reverted there, the
      # commit is still an ancestor of dev and this check passes. The repository
      # flow assumes deploys to dev are merge- or cherry-pick-based; intentional
      # reverts require manual redeployment oversight.
      - name: Verify PR changes are deployed to base dev
        env:
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          git remote add base "https://github.com/${BASE_REPO}.git" || true
          git fetch base dev
          git fetch base main
          pr_head="${{ github.event.pull_request.head.sha }}"
          if git merge-base --is-ancestor "$pr_head" base/dev; then
            echo "PR head is already an ancestor of base/dev; all changes are deployed."
            exit 0
          fi
          unique_commits=$(git rev-list base/main.."$pr_head")
          if [ -z "$unique_commits" ]; then
            echo "No unique commits found; nothing to deploy."
            exit 0
          fi
          cherry_output=$(git cherry base/dev "$pr_head")
          missing=()
          while IFS= read -r commit; do
            if git merge-base --is-ancestor "$commit" base/dev; then
              continue
            fi
            if ! echo "$cherry_output" | grep -q "^- $commit$"; then
              missing+=("$commit")
            fi
          done <<< "$unique_commits"
          if [ ${#missing[@]} -eq 0 ]; then
            echo "All PR changes are present on base/dev."
          else
            echo "The following PR commits are missing from base/dev:"
            printf '%s\n' "${missing[@]}"
            exit 1
          fi

      - name: Check deployed-to-dev status on base/dev HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dev_head=$(git rev-parse base/dev)
          echo "base/dev HEAD: $dev_head"
          state=$(gh api "repos/${{ github.repository }}/commits/${dev_head}/status" --jq '[.statuses[] | select(.context == "deployed-to-dev")] | sort_by(.created_at) | last // {} | .state // empty')
          if [ "$state" != "success" ]; then
            echo "deployed-to-dev status on base/dev HEAD is not success (state: ${state:-missing})."
            exit 1
          fi
          echo "deployed-to-dev status is success."
