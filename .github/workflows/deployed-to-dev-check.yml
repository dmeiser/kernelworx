name: Deployed to Dev Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  deployed-to-dev:
    name: Check PR is deployed to dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PR changes are deployed to base dev
        env:
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: |
          git remote add base "https://github.com/${BASE_REPO}.git" || true
          git fetch base dev
          git fetch base main
          pr_head="${{ github.event.pull_request.head.sha }}"

          changed_files=$(git diff --name-only base/main.."$pr_head")
          if [ -z "$changed_files" ]; then
            echo "No changed files found; nothing to deploy."
            exit 0
          fi

          missing_files=()
          while IFS= read -r file; do
            pr_blob=$(git ls-tree "$pr_head" "$file" | awk '{print $3}')
            dev_blob=$(git ls-tree base/dev "$file" | awk '{print $3}')
            if [ "$pr_blob" = "$dev_blob" ]; then
              echo "$file is present on base/dev with matching content."
            else
              missing_files+=("$file")
            fi
          done <<< "$changed_files"

          if [ ${#missing_files[@]} -eq 0 ]; then
            echo "All PR changes are present on base/dev."
          else
            echo "The following PR files are missing or differ on base/dev:"
            printf '%s\n' "${missing_files[@]}"
            exit 1
          fi

      - name: Check deployed-to-dev status on base/dev HEAD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dev_head=$(git rev-parse base/dev)
          echo "base/dev HEAD: $dev_head"
          state=$(gh api "repos/${{ github.repository }}/commits/${dev_head}/status" --jq '[.statuses[] | select(.context == "deployed-to-dev")] | sort_by(.created_at) | last // {} | .state // empty')
          if [ "$state" != "success" ]; then
            echo "deployed-to-dev status on base/dev HEAD is not success (state: ${state:-missing})."
            exit 1
          fi
          echo "deployed-to-dev status is success."
