name: Manual Teardown

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number of the ephemeral environment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: manual-teardown-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

jobs:
  manual-teardown:
    name: Manual teardown for PR #${{ github.event.inputs.pr_number }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ephemeral
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::750620721302:role/GitHubActionsKernelworxDev
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-ephemeral-manual-teardown

      - name: Validate PR number
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Teardown ephemeral environment
        env:
          TF_VAR_encryption_passphrase: ${{ secrets.TF_VAR_ENCRYPTION_PASSPHRASE }}
        run: scripts/ephemeral-env.sh down "pr-${PR_NUMBER}"
