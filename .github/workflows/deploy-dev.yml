name: Deploy Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-shared.yml
    with:
      environment: dev
      tofu-directory: tofu/application/environments/dev
      aws-role-session-name: github-actions-deploy-dev
      smoke-role-session-name: github-actions-smoke-tests-dev
      e2e-base-url: ${{ vars.E2E_BASE_URL_DEV }}
      e2e-base-url-var-suffix: DEV
      smoke-url-block-pattern: 'https://kernelworx.app*|https://www.kernelworx.app*'
      smoke-url-block-message: 'dev smoke tests against the production URL.'
      smoke-url-block-pattern-2: 'http://localhost:*'
      smoke-url-block-message-2: 'dev smoke tests against a local URL.'
      # SECURITY: dev test emails do not currently follow the test|smoke|integration naming
      # convention, so we explicitly opt into allowing them. The reusable workflow still
      # defaults to strict-test-account-names: true; this override is dev-only and must be
      # reviewed before any prod caller considers copying it.
      allow-non-test-account-emails: true
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_DEV_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_ENCRYPTION_PASSPHRASE: ${{ secrets.TF_VAR_ENCRYPTION_PASSPHRASE_DEV }}
      TF_VAR_GOOGLE_CLIENT_ID: ${{ secrets.TF_VAR_GOOGLE_CLIENT_ID_DEV }}
      TF_VAR_GOOGLE_CLIENT_SECRET: ${{ secrets.TF_VAR_GOOGLE_CLIENT_SECRET_DEV }}
      TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL_DEV }}
      TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD_DEV }}
      TEST_CONTRIBUTOR_EMAIL: ${{ secrets.TEST_CONTRIBUTOR_EMAIL_DEV }}
      TEST_CONTRIBUTOR_PASSWORD: ${{ secrets.TEST_CONTRIBUTOR_PASSWORD_DEV }}
      TEST_READONLY_EMAIL: ${{ secrets.TEST_READONLY_EMAIL_DEV }}
      TEST_READONLY_PASSWORD: ${{ secrets.TEST_READONLY_PASSWORD_DEV }}
      TEST_USER_POOL_ID: ${{ secrets.TEST_USER_POOL_ID_DEV }}
