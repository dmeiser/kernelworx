name: Deploy Dev

# The push trigger is the normal path: a merge into dev deploys. The dispatch
# trigger exists because a push event is not guaranteed to arrive - on
# 2026-11-16 dev moved to 526690b0 with no workflow run of any kind for it, so
# the merged fix was never deployed and the only way to recover was to write to
# dev again. `gh workflow run deploy-dev.yml --ref dev -f ref=dev` recovers the
# same tree without touching the branch. resolve-deploy-ref below refuses a ref
# that is not dev's head or a commit already merged into dev.
on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or full commit SHA to deploy. Must be dev's head or a commit already merged into dev."
        required: false
        default: dev
        type: string

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  resolve-vars:
    name: Resolve dev environment variables
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      e2e_base_url: ${{ steps.export.outputs.url }}
    steps:
      - name: Export dev E2E base URL
        id: export
        env:
          E2E_BASE_URL_DEV: ${{ vars.E2E_BASE_URL_DEV }}
        run: |
          e2e_url="${E2E_BASE_URL_DEV}"
          if [ -z "$e2e_url" ]; then
            echo "E2E_BASE_URL_DEV is not set in the dev environment. Set it to the dev app URL before running smoke tests."
            exit 1
          fi
          echo "url=$e2e_url" >> "$GITHUB_OUTPUT"
          echo "E2E_BASE_URL_DEV=$e2e_url"

  resolve-deploy-ref:
    name: Resolve the dev commit to deploy
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # A push run deploys the commit that was pushed, so the run's head and the
      # tree that lands on dev.kernelworx.app are the same commit. A dispatch run
      # has no push behind it: the operator names the ref and the guard resolves
      # it to a full SHA, refusing anything outside dev's history so a hand-run
      # deploy can never serve an unreleased tree.
      - name: Resolve the deploy ref
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.event.inputs.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 scripts/dev_deploy_gate.py resolve-ref --ref "${DISPATCH_REF:-dev}" --branch dev
          else
            echo "sha=$PUSH_SHA" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [resolve-vars, resolve-deploy-ref]
    uses: ./.github/workflows/deploy-shared.yml
    with:
      environment: dev
      checkout-ref: ${{ needs.resolve-deploy-ref.outputs.sha }}
      tofu-directory: tofu/application/environments/dev
      aws-role-session-name: github-actions-deploy-dev
      smoke-role-session-name: github-actions-smoke-tests-dev
      e2e-base-url: ${{ needs.resolve-vars.outputs.e2e_base_url }}
      e2e-base-url-var-suffix: DEV
      smoke-url-block-pattern: 'https://kernelworx.app*|https://www.kernelworx.app*'
      smoke-url-block-message: 'dev smoke tests against the production URL.'
      smoke-url-block-pattern-2: 'http://localhost:*'
      smoke-url-block-message-2: 'dev smoke tests against a local URL.'
      # SECURITY: dev test emails do not currently follow the test|smoke|integration naming
      # convention, so we explicitly opt into allowing them. The reusable workflow still
      # defaults to strict-test-account-names: true; this override is dev-only and must be
      # reviewed before any prod caller considers copying it.
      allow-non-test-account-emails: true
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_DEV_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      TF_VAR_ENCRYPTION_PASSPHRASE: ${{ secrets.TF_VAR_ENCRYPTION_PASSPHRASE_DEV }}
      TF_VAR_GOOGLE_CLIENT_ID: ${{ secrets.TF_VAR_GOOGLE_CLIENT_ID_DEV }}
      TF_VAR_GOOGLE_CLIENT_SECRET: ${{ secrets.TF_VAR_GOOGLE_CLIENT_SECRET_DEV }}
      TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL_DEV }}
      TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD_DEV }}
      TEST_CONTRIBUTOR_EMAIL: ${{ secrets.TEST_CONTRIBUTOR_EMAIL_DEV }}
      TEST_CONTRIBUTOR_PASSWORD: ${{ secrets.TEST_CONTRIBUTOR_PASSWORD_DEV }}
      TEST_READONLY_EMAIL: ${{ secrets.TEST_READONLY_EMAIL_DEV }}
      TEST_READONLY_PASSWORD: ${{ secrets.TEST_READONLY_PASSWORD_DEV }}
      TEST_USER_POOL_ID: ${{ secrets.TEST_USER_POOL_ID_DEV }}
