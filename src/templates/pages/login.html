{% extends "base.html" %}

{% block title %}Sign In — KernelWorx{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 64px); display: flex; align-items: center; justify-content: center; background: var(--brand-color-bg-layout); padding: 1rem;">
  <div class="card" style="width: 100%; max-width: 450px; margin: 0; padding: 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1rem;">
        <img src="/static/images/logo.svg" alt="KernelWorx mark" width="32" height="32">
        <span style="font-family: var(--display-family); font-weight: 700; font-size: 1.5rem; line-height: 1; letter-spacing: -0.01em;">
          <span style="color: var(--brand-color-text);">Kernel</span><span style="color: var(--brand-color-primary);">Worx</span>
        </span>
      </div>
      <h1 style="font-family: var(--display-family); font-weight: 700; font-size: 22px; line-height: 1.25; color: var(--brand-color-text); margin: 0 0 0.5rem;">Welcome Back</h1>
      <p style="color: var(--brand-color-text-secondary); font-size: 0.875rem; margin: 0;">Sign in to your KernelWorx account</p>
    </div>

    <div id="login-error" style="display: none; background: var(--brand-color-error-bg); color: var(--brand-color-error-active); border: 1px solid var(--brand-color-error-border); border-radius: 4px; padding: 0.75rem 1rem; font-size: 0.875rem; margin-bottom: 1.5rem;"></div>

    <form id="login-form" action="/api/auth/login" method="POST" onsubmit="handleLoginSubmit(event); return false;">
      <div style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem;">
        <div>
          <label for="email" style="display: block; font-size: 0.8125rem; color: var(--brand-color-text-secondary); margin-bottom: 0.35rem;">Email</label>
          <input type="email" id="email" name="email" required class="form-control" autocomplete="email" style="height: 32px; box-sizing: border-box;">
        </div>
        <div>
          <label for="password" style="display: block; font-size: 0.8125rem; color: var(--brand-color-text-secondary); margin-bottom: 0.35rem;">Password</label>
          <input type="password" id="password" name="password" required class="form-control" autocomplete="current-password" style="height: 32px; box-sizing: border-box;">
        </div>
      </div>

      <div style="text-align: right; margin-bottom: 1rem;">
        <a href="#" style="font-size: 0.875rem; color: var(--brand-color-link); text-decoration: none; font-weight: 600; background: none; border: none; cursor: pointer;">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; height: 40px; font-size: 1.125rem; margin-bottom: 1rem;">
        Sign In
      </button>

      <a href="#" onclick="passkeyLogin(event); return false;" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; height: 40px; font-family: var(--brand-font-family); font-size: 1.125rem; font-weight: 600; border-radius: 4px; background: var(--brand-color-bg-container); color: var(--brand-color-link); border: 1px solid var(--brand-color-link); text-decoration: none; margin-bottom: 1.5rem;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 14 3 12.01 3c-1.98 0-3.86.47-5.57 1.41-.24.13-.54.04-.68-.2-.13-.24-.04-.55.2-.68C7.82 2.52 9.86 2 12.01 2c2.13 0 3.99.47 6.03 1.52.25.13.34.43.21.67-.09.18-.26.28-.44.28M3.5 9.72c-.1 0-.2-.03-.29-.09-.23-.16-.28-.47-.12-.7.99-1.4 2.25-2.5 3.75-3.27C9.98 4.04 14 4.03 17.15 5.65c1.5.77 2.76 1.86 3.75 3.25.16.22.11.54-.12.7s-.54.11-.7-.12c-.9-1.26-2.04-2.25-3.39-2.94-2.87-1.47-6.54-1.47-9.4.01-1.36.7-2.5 1.7-3.4 2.96-.08.14-.23.21-.39.21m6.25 12.07c-.13 0-.26-.05-.35-.15-.87-.87-1.34-1.43-2.01-2.64-.69-1.23-1.05-2.73-1.05-4.34 0-2.97 2.54-5.39 5.66-5.39s5.66 2.42 5.66 5.39c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-2.42-2.09-4.39-4.66-4.39s-4.66 1.97-4.66 4.39c0 1.44.32 2.77.93 3.85.64 1.15 1.08 1.64 1.85 2.42.19.2.19.51 0 .71-.11.1-.24.15-.37.15m7.17-1.85c-1.19 0-2.24-.3-3.1-.89-1.49-1.01-2.38-2.65-2.38-4.39 0-.28.22-.5.5-.5s.5.22.5.5c0 1.41.72 2.74 1.94 3.56.71.48 1.54.71 2.54.71.24 0 .64-.03 1.04-.1.27-.05.53.13.58.41.05.27-.13.53-.41.58-.57.11-1.07.12-1.21.12M14.91 22c-.04 0-.09-.01-.13-.02-1.59-.44-2.63-1.03-3.72-2.1-1.4-1.39-2.17-3.24-2.17-5.22 0-1.62 1.38-2.94 3.08-2.94s3.08 1.32 3.08 2.94c0 1.07.93 1.94 2.08 1.94s2.08-.87 2.08-1.94c0-3.77-3.25-6.83-7.25-6.83-2.84 0-5.44 1.58-6.61 4.03-.39.81-.59 1.76-.59 2.8 0 .78.07 2.01.67 3.61.1.26-.03.55-.29.64-.26.1-.55-.04-.64-.29-.49-1.31-.73-2.61-.73-3.96 0-1.2.23-2.29.68-3.24 1.33-2.79 4.28-4.6 7.51-4.6 4.55 0 8.25 3.51 8.25 7.83 0 1.62-1.38 2.94-3.08 2.94s-3.08-1.32-3.08-2.94c0-1.07-.93-1.94-2.08-1.94s-2.08.87-2.08 1.94c0 1.71.66 3.31 1.87 4.51.95.94 1.86 1.46 3.27 1.85.27.07.42.35.35.61-.05.23-.26.38-.47.38"/></svg>
        Sign In with Passkey
      </a>
    </form>

    <div style="display: flex; align-items: center; margin: 1.5rem 0; gap: 1rem;">
      <div style="flex: 1; height: 1px; background: var(--brand-color-border);"></div>
      <span style="color: var(--brand-color-text-secondary); font-size: 0.875rem; font-weight: 400;">OR</span>
      <div style="flex: 1; height: 1px; background: var(--brand-color-border);"></div>
    </div>

    <a href="https://{{ cognito_domain }}/oauth2/authorize?client_id={{ cognito_client_id }}&response_type=code&scope=email+openid+profile&redirect_uri=http://localhost:8000/scouts&identity_provider=Google"
       style="display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem; width: 100%; height: 40px; font-family: var(--brand-font-family); font-size: 1.125rem; font-weight: 600; border-radius: 4px; background: var(--brand-color-bg-container); color: var(--brand-color-link); border: 1px solid var(--brand-color-link); text-decoration: none; margin-bottom: 1.5rem;">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </a>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--brand-color-text-secondary);">
      Don't have an account? <a href="/signup" style="color: var(--brand-color-link); font-weight: 600; text-decoration: none;">Sign up</a>
    </div>
  </div>
</div>
{% endblock %}
