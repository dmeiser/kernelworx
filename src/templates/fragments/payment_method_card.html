<div class="card" id="pm-card-{{ pm.name|lower|replace(' ', '-') }}" style="border: 1px solid var(--brand-color-border-secondary); border-radius: var(--brand-border-radius-lg); box-shadow: 0 1px 2px var(--brand-color-fill-quaternary); margin-bottom: 0;">
  <div style="padding: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', sans-serif; font-weight: 600; font-size: 16px; color: var(--brand-color-text);">{{ pm.name }}</span>
        {% if pm.name in ['Cash', 'Check'] %}
          <span style="display: inline-block; padding: 2px 8px; border-radius: var(--brand-border-radius-sm); font-size: 0.75rem; font-weight: 600; background-color: transparent; color: var(--brand-color-text-secondary); border: 1px solid var(--brand-color-border);">Built-in</span>
        {% endif %}
        {% if pm.qrCodeUrl %}
          <button aria-label="View QR code for {{ pm.name }}" title="Click to view QR code" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; color: var(--brand-color-primary); background: none; border: none; cursor: pointer; border-radius: var(--brand-border-radius);"
                  hx-get="/api/payment-methods/qr-preview?name={{ pm.name|urlencode }}"
                  hx-target="#qr-preview-modal"
                  hx-swap="innerHTML">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zM3 13h8v8H3zm2 2v4h4v-4zm8-2h8v8h-8zm2 2v4h4v-4z"/></svg>
          </button>
        {% endif %}
      </div>
      {% if pm.name not in ['Cash', 'Check'] %}
        <div style="display: flex; gap: 4px;">
          {% if not pm.qrCodeUrl %}
            <button title="Upload QR code" aria-label="Upload QR code for {{ pm.name }}" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; color: var(--brand-color-text-secondary); background: none; border: none; cursor: pointer; border-radius: var(--brand-border-radius);"
                    hx-get="/api/payment-methods/qr-upload-form?name={{ pm.name|urlencode }}"
                    hx-target="#modal-container"
                    hx-swap="innerHTML">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5z"/></svg>
            </button>
          {% else %}
            <button title="Delete QR code" aria-label="Delete QR code for {{ pm.name }}" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; color: var(--brand-color-warning); background: none; border: none; cursor: pointer; border-radius: var(--brand-border-radius);"
                    hx-delete="/api/payment-methods/{{ pm.name|urlencode }}/qr"
                    hx-target="#pm-card-{{ pm.name|lower|replace(' ', '-') }}"
                    hx-swap="outerHTML"
                    hx-confirm="Are you sure you want to delete the QR code for {{ pm.name }}?">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14zM9 18c-.55 0-1-.45-1-1V9c0-.55.45-1 1-1s1 .45 1 1v8c0 .55-.45 1-1 1zm6 0c-.55 0-1-.45-1-1V9c0-.55.45-1 1-1s1 .45 1 1v8c0 .55-.45 1-1 1z"/></svg>
            </button>
          {% endif %}
          <button title="Edit name" aria-label="Edit {{ pm.name }}" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; color: var(--brand-color-text-secondary); background: none; border: none; cursor: pointer; border-radius: var(--brand-border-radius);"
                  hx-get="/api/payment-methods/edit-form?name={{ pm.name|urlencode }}"
                  hx-target="#modal-container"
                  hx-swap="innerHTML">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75z"/></svg>
          </button>
          <button title="Delete payment method" aria-label="Delete {{ pm.name }}" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; color: var(--brand-color-error); background: none; border: none; cursor: pointer; border-radius: var(--brand-border-radius);"
                  hx-delete="/api/payment-methods/{{ pm.name|urlencode }}"
                  hx-target="#pm-card-{{ pm.name|lower|replace(' ', '-') }}"
                  hx-swap="outerHTML"
                  hx-confirm="Are you sure you want to delete the payment method &quot;{{ pm.name }}&quot;?">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg>
          </button>
        </div>
      {% endif %}
    </div>
  </div>
</div>
