<div class="card" id="campaign-card-{{ campaign.campaignId }}" style="box-shadow: 0 8px 28px -16px var(--brand-color-fill-secondary);">
  <div style="padding-bottom: 8px;">
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
          <h3 style="font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', sans-serif; font-weight: 600; font-size: 16px; line-height: 1.35; color: var(--brand-color-text); margin: 0;">{{ campaign.name }} {{ campaign.year }}</h3>
          {% if campaign.isActive != false %}
            <span style="display: inline-block; background-color: var(--brand-color-success-bg); color: var(--brand-color-success-active); border: 1px solid var(--brand-color-success-border); padding: 2px 8px; border-radius: var(--brand-border-radius-sm); font-size: 0.75rem; font-weight: 600;">Active</span>
          {% endif %}
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--brand-color-text-secondary)"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2zM17 18c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
          <span style="font-size: 0.875rem; color: var(--brand-color-text-secondary);">{{ campaign.totalOrders|default(0) }} {{ 'order' if campaign.totalOrders == 1 else 'orders' }}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--brand-color-text-secondary)"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
          <span style="font-size: 0.875rem; color: var(--brand-color-text-secondary);">${{ "%.2f"|format(campaign.totalRevenue|default(0)) }} in sales</span>
        </div>
      </div>
    </div>
  </div>
  <div>
    <a href="/scouts/{{ profile_id|urlencode }}/campaigns/{{ campaign.campaignId|urlencode }}" class="btn" style="display: inline-flex; align-items: center; justify-content: center; width: 100%; background-color: var(--brand-color-bg-container); color: var(--brand-color-link); border: 1px solid var(--brand-color-link); text-decoration: none; height: 24px; padding: 0 8px; font-size: 0.75rem; font-weight: 600; border-radius: var(--brand-border-radius);">View Orders</a>
  </div>
</div>
