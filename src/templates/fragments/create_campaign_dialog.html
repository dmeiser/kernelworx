<dialog id="create-campaign-dialog" open>
  <h2 style="font-family: 'Bricolage Grotesque', 'Atkinson Hyperlegible', sans-serif; font-weight: 600; font-size: 18px; color: var(--brand-color-text); margin: 0 0 16px 0;">New Campaign</h2>

  <form hx-post="/api/campaigns"
        hx-target="#campaigns-list"
        hx-swap="beforeend"
        hx-on::after-request="document.getElementById('create-campaign-dialog').close(); document.getElementById('create-campaign-dialog').remove();">

    <input type="hidden" name="profileId" value="{{ profile_id }}">

    <div class="form-group">
      <label for="name" style="display: block; font-size: 0.8125rem; color: var(--brand-color-text-secondary); margin-bottom: 4px;">Campaign Name</label>
      <input type="text" id="name" name="name" autofocus required class="form-control" placeholder="e.g., Fall 2026, Spring Fundraiser" style="width: 100%; padding: 0 12px; font-size: 0.875rem; border: 1px solid var(--brand-color-border); border-radius: var(--brand-border-radius); height: 32px; box-sizing: border-box;">
    </div>

    <div class="form-group">
      <label for="year" style="display: block; font-size: 0.8125rem; color: var(--brand-color-text-secondary); margin-bottom: 4px;">Year</label>
      <input type="number" id="year" name="year" required class="form-control" value="2026" min="2020" max="2031" step="1" style="width: 100%; padding: 0 12px; font-size: 0.875rem; border: 1px solid var(--brand-color-border); border-radius: var(--brand-border-radius); height: 32px; box-sizing: border-box;">
    </div>

    <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px;">
      <button type="button" class="btn" style="height: 32px; padding: 0 12px; font-size: 0.875rem; font-weight: 600; background: var(--brand-color-bg-container); color: var(--brand-color-text); border: 1px solid var(--brand-color-border); border-radius: var(--brand-border-radius); cursor: pointer;" onclick="this.closest('dialog').close(); this.closest('dialog').remove();">Cancel</button>
      <button type="submit" class="btn btn-primary" style="height: 32px; padding: 0 12px; font-size: 0.875rem; font-weight: 600; background-color: var(--brand-primary-palette-7); color: #ffffff; border: 1px solid var(--brand-primary-palette-7); border-radius: var(--brand-border-radius); cursor: pointer;">Create Campaign</button>
    </div>
  </form>
</dialog>
