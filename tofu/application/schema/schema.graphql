# Participant-safe campaign join preview (API §4.1): exactly these five
# fields — no inventory, roster, grant, joinCode, or settings data.

type UnitCampaignJoinPreview {
  unitDisplayName: String!
  campaignName: String!
  campaignYear: Int!
  catalogName: String!
  isActive: Boolean!
}

# Administrative campaign shape (API §4.1); distinct from the preview above.

type UnitCampaignAdmin {
  unitCampaignId: ID!
  unitId: ID!
  campaignName: String!
  campaignYear: Int!
  catalogId: ID!
  joinCode: String!
  isActive: Boolean!
  version: Int!
  createdAt: String!
  updatedAt: String!
  createdByAccountId: ID!
  updatedByAccountId: ID
}

type UnitCampaignConnection {
  items: [UnitCampaignAdmin!]!
  pageInfo: PageInfo!
}

type UnitCampaignMembership {
  unitCampaignId: ID!
  unitId: ID!
  campaignId: ID!
  profileId: ID!
  status: MembershipStatus!
  joinedByAccountId: ID!
  joinedAt: String!
  removedByAccountId: ID
  removedAt: String
  version: Int!
  profileDisplayName: String
  campaignName: String
  # The Scout Campaign membership-guard version this row was read with —
  # removeUnitCampaignMembership conditions on it, and the guard moves
  # independently of the membership row (signups bump the membership; the
  # guard moves on join/removal only). Without this field the client cannot
  # satisfy expectedGuardVersion after participation (recording-wave find).
  guardVersion: Int
}

type UnitCampaignMembershipConnection {
  items: [UnitCampaignMembership!]!
  pageInfo: PageInfo!
}

type UnitCampaignCatalog {
  catalogId: ID!
  catalogName: String!
