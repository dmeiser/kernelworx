  acknowledgementsAccepted: Boolean! # Must be true
  firstName: String!                 # Max length 100
  lastName: String!                  # Max length 100
  phone: String                      # US 10-digit format
  address: AddressInput              # All 4 fields if provided
  email: AWSEmail                    # Valid format
  paymentMethod: String!             # Must be on campaign's public allowlist
  lineItems: [LineItemInput!]!       # 1..20 items, qty 1..999
  notes: String                      # Max length 500
}

# ============================================================================
# Show & Sell and inventory — Stage 1: Units and Unit Campaigns
#
# Foundation SDL for the Show & Sell and inventory program. These types and
# root fields define the binding surface for the Unit and Unit Campaign domain.
# Every field here is Cognito-only: the API's Cognito user-pool auth mode
# defaults to ALLOW and the API-key mode defaults to DENY, so a field with no
# @aws_ directive is reachable only by an authenticated Cognito caller and never
# by the public orders API key. No Show & Sell field carries @aws_api_key.
# Authorization (Unit Admin / Profile access) is enforced in the resolvers, the
# same resolver-only posture the rest of the schema relies on.
#
# Pagination, idempotency, and versioning use the shared contracts in section 3
# of the Show & Sell GraphQL API spec: every new mutation embeds IdempotencyInput,
# version-changing operations embed VersionedInput, and every list resolver takes
# a PageInput and returns a connection of `items` plus `pageInfo`.
# ============================================================================

"""Pagination parameters for a list resolver: a limit (default 50, max 100) and an opaque cursor."""
input PageInput {
  """Maximum number of items to return in the page (1-100). Defaults to 50."""
  limit: Int = 50
  """Opaque cursor from a previous page; omit to start from the first page."""
  cursor: String
}

"""Server-issued cursor state for one page of a Show & Sell connection."""
type PageInfo {
  """Opaque cursor to pass back as `page.cursor` to fetch the next page, or null when no results remain."""
  endCursor: String
  """True while more results remain after this page."""
  hasNextPage: Boolean!
}

"""Idempotency for a mutation: a client key scoped to the caller, operation, and resource."""
input IdempotencyInput {
  """Client-supplied idempotency key (1-128 trimmed characters)."""
  idempotencyKey: String!
}

"""Optimistic-concurrency version carried by a version-changing operation."""
input VersionedInput {
  """The version the caller last read; a mismatch returns CONFLICT."""
  expectedVersion: Int!
}

"""The stored role on a Unit access grant. Only one role exists; 'Unit Kernel' is a display synonym, not a stored value."""
enum UnitRole {
  """Full Unit administrator."""
  UNIT_ADMIN
}

"""Membership status on a Unit Campaign roster."""
enum MembershipStatus {
  """Active roster member; may sign up for events."""
  ACTIVE
  """Removed from the roster; blocks new signups, preserves history."""
  REMOVED
}

"""How event earnings are split between participants."""
enum SplitMethod {
  """Split equally among eligible participants."""
  EQUAL
  """Split in proportion to confirmed work minutes."""
  TIME_WORKED
}

"""Primary presentation basis for a unit's needs report."""
enum CouncilNeedBasis {
  """Present on physical stock held in the kernel."""
  PHYSICAL_STOCK
  """Present after applying assignments."""
  AFTER_ASSIGNMENTS
}

"""A scout unit: a type/number/city/state identity plus its settings and authoritative admin count."""
type Unit {
  """The unit's stable ID; never derived from metadata."""
  unitId: ID!
  """The scout unit type, for example Pack or Troop."""
  unitType: String!
  """The scout unit number (a display value; not globally unique)."""
  unitNumber: Int!
  """Geographic discriminator: the city."""
  city: String!
  """Geographic discriminator: the state."""
  state: String!
  """Display name; generated from the metadata when the caller omits it."""
  displayName: String
  """Normalized unitType#unitNumber#city#state key used for duplicate lookup only; never grants access."""
  metadataKey: String
  """Timezone for display and calendar generation."""
  timezone: String!
  """Unit-wide default split method for new events."""
  splitDefault: SplitMethod!
  """Primary presentation basis for the unit's needs report."""
  councilNeedBasis: CouncilNeedBasis!
  """Authoritative count of access grants; always at least 1."""
  adminCount: Int!
  """Optimistic-concurrency version protecting grant and settings mutations."""
  version: Int!
  """When the unit was created."""
  createdAt: AWSDateTime!
  """When the unit was last updated."""
  updatedAt: AWSDateTime!
  """The account that created the unit and is its initial Unit Admin."""
  createdByAccountId: ID!
}

"""A page of units."""
type UnitConnection {
  """The units on this page."""
  items: [Unit!]!
  """Cursor state for the next page."""
  pageInfo: PageInfo!
}

"""A Unit administrator's access grant to a Unit, with the account's identity limited to what administration needs."""
type UnitAccessGrant {
  """The Unit this grant is on."""
  unitId: ID!
  """The granted account's ID."""
  accountId: ID!
  """The granted account's email, limited to administration needs."""
  email: String
  """The granted account's display name, limited to administration needs."""
  name: String
  """The stored role; only UNIT_ADMIN exists."""
  role: UnitRole!
  """The Unit Admin (or creator) who created the grant."""
  createdByAccountId: ID!
  """When the grant started; no automatic expiry."""
  createdAt: AWSDateTime!
}

"""A page of unit admin grants."""
type UnitAccessGrantConnection {
  """The grants on this page."""
  items: [UnitAccessGrant!]!
  """Cursor state for the next page."""
  pageInfo: PageInfo!
}

"""A single-use, 14-day credential a Unit Admin generates to add another Unit Admin."""
type UnitInvite {
  """The 16-character bearer code; returned only for active, unused invites."""
  inviteCode: String!
  """The Unit this invite joins."""
  unitId: ID!
  """The Unit Admin who generated the invite."""
  createdByAccountId: ID!
  """When the invite was created."""
  createdAt: AWSDateTime!
  """When the invite expires (at most 14 days from creation)."""
  expiresAt: AWSDateTime!
}

"""A page of unit invites (only active, unused invites are returned)."""
type UnitInviteConnection {
  """The invites on this page."""
  items: [UnitInvite!]!
  """Cursor state for the next page."""
  pageInfo: PageInfo!
}

"""A Unit-managed payment method. Built-in Cash/Check/Other are computed on every read and are never stored; custom methods carry a stable ID that survives renames."""
type UnitPaymentMethod {
  """Stable ID within the method's history; built-ins report CASH, CHECK, or OTHER."""
  paymentMethodId: ID!
  """The owning Unit."""
  unitId: ID!
  """The current name shown to users; historical sale snapshots keep the name captured at sale time."""
  displayName: String!
  """Inactive methods are unavailable for new sales but preserved for history."""
  isActive: Boolean!
  """S3 key of the optional shared QR image; null when none is attached. Unit Admin reads only."""
  qrCodeS3Key: String
  """When the method was created; null for the computed built-ins."""
  createdAt: AWSDateTime
  """When the method was last updated; null for the computed built-ins."""
  updatedAt: AWSDateTime
  """The Unit Admin who created it; null for the computed built-ins."""
  createdByAccountId: ID
  """The Unit Admin who last updated it; null for the computed built-ins."""
  updatedByAccountId: ID
  """Optimistic-concurrency version for rename and QR mutations; built-ins report 0 and are not mutable."""
  version: Int!
}

"""Input for createUnitPaymentMethod. Cash/Check/Other names are reserved case-insensitively; at most 50 active custom methods per Unit."""
input CreateUnitPaymentMethodInput {
  """The owning Unit."""
  unitId: ID!
  """The display name (1-100 trimmed characters); unique per Unit case-insensitively."""
  displayName: String!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for updateUnitPaymentMethod. A rename is a key-changing update; historical sale snapshots are never rewritten."""
input UpdateUnitPaymentMethodInput {
  """The owning Unit."""
  unitId: ID!
  """The method's stable paymentMethodId (built-in IDs cannot be renamed)."""
  paymentMethodId: ID!
  """The new display name; same reserved/duplicate-name rules as create."""
  displayName: String!
  """The version the caller last read (optimistic concurrency)."""
  version: VersionedInput!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for deactivateUnitPaymentMethod. Soft deactivation only; historical sales remain readable."""
input DeactivateUnitPaymentMethodInput {
  """The owning Unit."""
  unitId: ID!
  """The method's stable paymentMethodId (built-in IDs cannot be deactivated)."""
  paymentMethodId: ID!
  """The version the caller last read (optimistic concurrency)."""
  version: VersionedInput!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for requestUnitPaymentMethodQrUpload. Reuses the existing QR validation: PNG/JPEG/WebP, 5 MB maximum."""
input RequestUnitPaymentMethodQrUploadInput {
  """The owning Unit."""
  unitId: ID!
  """The method's stable paymentMethodId (built-in IDs have no QR image)."""
  paymentMethodId: ID!
  """The image content type the browser uploads: image/png, image/jpeg, or image/webp."""
  contentType: String!
  """Lowercase hex SHA-256 of the exact bytes being uploaded; the object name commits to it and confirm proves the object matches it."""
  sha256: String!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for confirmUnitPaymentMethodQrUpload. Validates the uploaded object before the reference is written."""
input ConfirmUnitPaymentMethodQrUploadInput {
  """The owning Unit."""
  unitId: ID!
  """The method's stable paymentMethodId."""
  paymentMethodId: ID!
  """The s3Key returned by requestUnitPaymentMethodQrUpload; a key for another method is refused."""
  s3Key: String!
  """The version the caller last read (optimistic concurrency)."""
  version: VersionedInput!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for deleteUnitPaymentMethodQrCode. Removes the S3 object and the reference; sale history is untouched."""
input DeleteUnitPaymentMethodQrCodeInput {
  """The owning Unit."""
  unitId: ID!
  """The method's stable paymentMethodId."""
  paymentMethodId: ID!
  """The version the caller last read (optimistic concurrency)."""
  version: VersionedInput!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""A short-lived pre-signed GET for one payment method's QR image. Not a report download."""
type UnitPaymentMethodQrDownload {
  """The pre-signed S3 GET URL the browser embeds; it stops working at expiresAt."""
  downloadUrl: String!
  """When the URL stops working."""
  expiresAt: AWSDateTime!
}

"""The administrative view of a Unit Campaign, including its reusable join code and settings."""
type UnitCampaignAdmin {
  """The Unit Campaign's stable ID."""
  unitCampaignId: ID!
  """The parent Unit."""
  unitId: ID!
  """The sales-season name."""
  campaignName: String!
  """The sales year."""
  campaignYear: Int!
  """The existing catalog used by this campaign (immutable after creation)."""
  catalogId: ID!
  """The reusable campaign-join credential."""
  joinCode: String!
  """Deactivation has no inventory or obligation side effects."""
  isActive: Boolean!
  """Optimistic-concurrency version for metadata and deactivation updates."""
  version: Int!
  """When the campaign was created."""
  createdAt: AWSDateTime!
  """When the campaign was last updated."""
  updatedAt: AWSDateTime!
  """The Unit Admin who created the campaign."""
  createdByAccountId: ID!
  """The Unit Admin who last updated the campaign."""
  updatedByAccountId: ID!
}

"""A page of a Unit's campaigns."""
type UnitCampaignConnection {
  """The campaigns on this page."""
  items: [UnitCampaignAdmin!]!
  """Cursor state for the next page."""
  pageInfo: PageInfo!
}

# participant-safe: the 1.7.5 guard suite derives its participant-type set from
# this marker; any type a bare join code or READ grant can see must carry it
# and is then rejected if it exposes an administrative field.
"""The member-safe preview of a Unit Campaign, exposed to any authenticated account via the join code. Carries no join code, IDs, catalog ID, or settings."""
type UnitCampaignJoinPreview {
  """The parent unit's display name."""
  unitDisplayName: String!
  """The sales-season name."""
  campaignName: String!
  """The sales year."""
  campaignYear: Int!
  """The campaign catalog's display name."""
  catalogName: String!
  """Whether the campaign is currently active."""
  isActive: Boolean!
}

"""The Unit Campaign's catalog and product inputs for browser sales sheets (including events with no sales)."""
type UnitCampaignCatalog {
  """The catalog's ID."""
  catalogId: ID!
  """The catalog's display name."""
  catalogName: String!
  """The catalog's products, in display order."""
  products: [Product!]!
}

"""A roster link between a Unit Campaign and a Scout (Campaign/Profile)."""
type UnitCampaignMembership {
  """The joined Unit Campaign."""
  unitCampaignId: ID!
  """Denormalized tenancy check: the parent Unit."""
  unitId: ID!
  """The existing Scout Campaign (immutable)."""
  campaignId: ID!
  """The Scout's profile identity."""
  profileId: ID!
  """
  The Scout's display name, read from the profile row at read time. A roster is acted on by
  a person, so an id alone cannot tell two Scouts apart; the empty string means the profile
  row cannot be read, which is when the caller shows the id it already has.
  """
  scoutName: String!
  """The joined Scout Campaign's display name, read at read time; empty when its row cannot be read."""
  campaignName: String!
  """
  The catalog the joined Scout Campaign sells from, or null when its row cannot be read. An
  individual Order is priced in this catalog while this Unit Campaign's stock is keyed to
  this campaign's own catalog, and product identity is catalog-scoped (`UNIT-06`, `CYCLE-01`),
  so a door-to-door sale that consumes this campaign's stock is only possible when the two
  catalogs are the same one.
  """
  scoutCampaignCatalogId: ID
  """ACTIVE allows new signups; REMOVED blocks them."""
  status: MembershipStatus!
  """The account that redeemed the join code."""
  joinedByAccountId: ID!
  """When the Scout joined."""
  joinedAt: AWSDateTime!
  """The Unit Admin who removed the Scout, or null when not removed."""
  removedByAccountId: ID
  """When the Scout was removed, or null when not removed."""
  removedAt: AWSDateTime
  """Optimistic-concurrency version for membership mutations and rejoin."""
  version: Int!
