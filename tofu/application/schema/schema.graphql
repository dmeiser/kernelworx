# Participant projection (5.4.3): the visible Scout's own approved/suspended
# credits. Deliberately carries NO finalizationId, actors, cash, returns, or
# buyer details, and never another Scout's rows.

type ParticipantSalesCredit {
  showAndSellId: ID!
  unitCampaignId: ID!
  campaignId: ID!
  amountCents: Int!
  status: String!
  versionNumber: Int!
  createdAt: String!
}

type ParticipantSalesCreditConnection {
  items: [ParticipantSalesCredit!]!
  pageInfo: PageInfo!
}

# Participant-safe pending projection (5.4.4): what WOULD be approved at
# the next finalization, minus already-approved credit. Never carries actor
# or admin fields; pending never counts in approved totals.

type ParticipantPendingAllocation {
  showAndSellId: ID!
  unitCampaignId: ID!
  campaignId: ID!
  profileId: ID!
  pendingAmountCents: Int!
  eventVersion: Int!
  computedAt: String!
}

type ParticipantPendingAllocationConnection {
  items: [ParticipantPendingAllocation!]!
  pageInfo: PageInfo!
}

type ScoutCampaignShowAndSellTotal {
