    showAndSellId: ID!
    slotId: ID!
    profileId: ID!
    expectedVersion: Int!
    idempotencyKey: String!
  ): ParticipantSignup!
  """Confirm worked time (Unit Admins only)."""
  confirmShowAndSellWork(
    showAndSellId: ID!
    work: [WorkConfirmationInput!]!
    expectedVersion: Int!
    idempotencyKey: String!
  ): ConfirmWorkResult!

  # --- Show & Sell wave 5: payment methods, sales, We Owe (spec API section 7) ---
  """The Unit's payment methods (Unit Admins only)."""
  createUnitPaymentMethod(unitId: ID!, displayName: String!, idempotencyKey: String!): UnitPaymentMethod!
  """Rename a Unit payment method (Unit Admins only)."""
  updateUnitPaymentMethod(unitId: ID!, paymentMethodId: ID!, displayName: String!, expectedVersion: Int!, idempotencyKey: String!): UnitPaymentMethod!
  """Deactivate a Unit payment method (Unit Admins only)."""
  deactivateUnitPaymentMethod(unitId: ID!, paymentMethodId: ID!, expectedVersion: Int!, idempotencyKey: String!): UnitPaymentMethod!
  """Request a presigned QR upload for a Unit payment method (Unit Admins only)."""
  requestUnitPaymentMethodQrUpload(unitId: ID!, paymentMethodId: ID!, contentType: String!, idempotencyKey: String!): S3UploadInfo!
  """Confirm a QR upload landed (Unit Admins only)."""
  confirmUnitPaymentMethodQrUpload(unitId: ID!, paymentMethodId: ID!, expectedVersion: Int!, s3Key: String!, idempotencyKey: String!): UnitPaymentMethod!
  """Delete a Unit payment method's QR code (Unit Admins only)."""
  deleteUnitPaymentMethodQrCode(unitId: ID!, paymentMethodId: ID!, expectedVersion: Int!, idempotencyKey: String!): UnitPaymentMethod!
  """Record a sale at an event: immediate-handoff arithmetic, allocation-drawn stock."""
  createShowAndSellSale(
    showAndSellId: ID!
    expectedEventVersion: Int!
    saleAt: String!
    buyerName: String
    buyerPhone: String
    buyerEmail: String
    lineItems: [ShowAndSellSaleLineInput!]!
    paymentMethod: PaymentMethodInput!
    idempotencyKey: String!
