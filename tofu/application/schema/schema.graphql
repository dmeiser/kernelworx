    """The profile's ID."""
    profileId: ID!,
    """The account whose access should be revoked."""
    targetAccountId: ID!
  ): Boolean!
  """Set or clear a campaign's sharedCampaignCode, associating it with a shared campaign (admin only). Returns the updated campaign."""
  adminUpdateCampaignSharedCode(
    """The campaign's ID."""
    campaignId: ID!,
    """The shared campaign's code to associate, or null to clear it."""
    sharedCampaignCode: String
  ): Campaign!
  """Create an admin-managed global catalog available to all users (admin only). Returns the created catalog."""
  createManagedCatalog(
    """The new catalog's details and products."""
    input: CreateCatalogInput!
  ): Catalog!
  # --- Show & Sell: Units and Unit Campaigns (spec API sections 4-5) ---
  """Create a Unit; the creator becomes its first Unit Admin."""
  createUnit(input: CreateUnitInput!): CreateUnitResult!
  """Update a Unit (Unit Admins only; optimistic concurrency via expectedVersion)."""
  updateUnit(input: UpdateUnitInput!): Unit!
  """Create a Unit invite (Unit Admins only; at most 20 active)."""
  createUnitInvite(unitId: ID!, idempotencyKey: String!): UnitInvite!
  """Revoke a Unit invite (Unit Admins only)."""
  revokeUnitInvite(unitId: ID!, inviteCode: String!, idempotencyKey: String!): Boolean!
  """Redeem a Unit invite; every failure outcome is indistinguishable NOT_FOUND (spec 5.3)."""
  redeemUnitInvite(inviteCode: String!, idempotencyKey: String!): UnitAccessGrant!
  """Remove a Unit Admin grant; a Unit must keep at least one admin."""
  revokeUnitAccessGrant(
    unitId: ID!
    accountId: ID!
    expectedVersion: Int!
    idempotencyKey: String!
  ): Unit!
  """Create a Unit Campaign (Unit Admins only)."""
  createUnitCampaign(input: CreateUnitCampaignInput!): UnitCampaignAdmin!
  """Update a Unit Campaign (Unit Admins only)."""
  updateUnitCampaign(input: UpdateUnitCampaignInput!): UnitCampaignAdmin!
  """Join a Unit Campaign with a Scout Campaign (join-time catalog identity enforced)."""
  joinUnitCampaign(joinCode: String!, campaignId: ID!, idempotencyKey: String!): UnitCampaignMembership!
  """Remove a Scout Campaign from the roster (Unit Admins only)."""
  removeUnitCampaignMembership(
    unitCampaignId: ID!
    campaignId: ID!
    expectedMembershipVersion: Int!
    expectedGuardVersion: Int!
    idempotencyKey: String!
  ): UnitCampaignMembership!

  # --- Show & Sell wave 3: inventory + fulfillment (spec API section 6) ---
  """Record a council stock receipt (Unit Admins only)."""
  recordInventoryReceipt(
    unitCampaignId: ID!
    productId: ID!
    quantity: Int!
    occurredAt: String
    idempotencyKey: String!
  ): InventoryPosition!
  """Adjust kernel physical stock with a mandatory reason (Unit Admins only)."""
  adjustInventory(
    unitCampaignId: ID!
    productId: ID!
    quantityDelta: Int!
    reason: String!
    idempotencyKey: String!
  ): InventoryPosition!
  """Adjust the council-on-order bucket; never reduces council need (Unit Admins only)."""
  adjustCouncilOnOrder(
    unitCampaignId: ID!
    productId: ID!
    quantityDelta: Int!
    reason: String
    idempotencyKey: String!
  ): InventoryPosition!
  """Issue kernel stock to a Scout's custody in ONE transaction (Unit Admins only)."""
  issueStockToScout(
    unitCampaignId: ID!
    campaignId: ID!
    profileId: ID!
    productId: ID!
    quantity: Int!
    idempotencyKey: String!
  ): IssueStockResult!
  """Return with-Scout stock to the unit in ONE transaction (Unit Admins only)."""
  returnStockFromScout(
    unitCampaignId: ID!
    campaignId: ID!
    profileId: ID!
    items: [ProductQuantityInput!]!
    idempotencyKey: String!
  ): ReturnStockResult!
  """Fulfill one order line from a named source; append-only fulfillment record."""
  fulfillIndividualOrderLine(
    orderId: ID!
    lineItemId: ID!
    quantity: Int!
    source: FulfillmentSource!
    expectedFulfillmentVersion: Int!
    idempotencyKey: String!
  ): FulfillOrderLineResult!
  """Reverse a fulfillment with a deterministic REVERSAL# record (never an overwrite)."""
  reverseIndividualOrderFulfillment(
    orderId: ID!
    fulfillmentId: ID!
    expectedFulfillmentVersion: Int!
    idempotencyKey: String!
  ): FulfillOrderLineResult!

  # --- Show & Sell wave 4: events, slots, signups (spec API section 6) ---
  """Create a Show & Sell event (Unit Admins only; immutable times per spec 9.1)."""
  createShowAndSell(input: CreateShowAndSellInput!): ShowAndSell!
  """Update an event (Unit Admins only; times stay immutable once set)."""
  updateShowAndSell(input: UpdateShowAndSellInput!): ShowAndSell!
  """Cancel an event (Unit Admins only; optimistic concurrency)."""
  cancelShowAndSell(
    showAndSellId: ID!
    expectedVersion: Int!
    reason: String!
    idempotencyKey: String!
  ): ShowAndSell!
  """Assign inventory to an event: TARGET quantities, evaluated against sale intervals (Unit Admins only)."""
  assignShowAndSellInventory(
    showAndSellId: ID!
    items: [AllocationTargetInput!]!
    expectedVersion: Int!
    idempotencyKey: String!
  ): AssignShowAndSellInventoryResult!
  """Create or update a work slot of arbitrary duration (Unit Admins only; at most 20 active slots)."""
  upsertShowAndSellSlot(input: UpsertShowAndSellSlotInput!): ShowAndSellSlot!
  """Delete a slot (Unit Admins only)."""
  deleteShowAndSellSlot(
    showAndSellId: ID!
    slotId: ID!
    expectedVersion: Int!
    idempotencyKey: String!
  ): Boolean!
  """Sign a Scout Campaign up for a slot (sequence contract; finalization feasibility enforced)."""
  signupScoutForShowAndSellSlot(
