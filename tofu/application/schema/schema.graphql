# ============================================================================
# Show & Sell and inventory — Stage 2: inventory balances, receipt, adjustment
#
# The §5.7 balance and §5.8 audit trail for one Unit Campaign's products. The
# balance is one row per (unitCampaignId, productId); every change to it appends an
# InventoryMovement that says which quantity moved, who moved it, and why. The
# assigned/unassigned/overage/With-Scout numbers are never stored: a position is
# computed server-side from the open event allocations and the custody rows, so a
# page cannot display a counter some earlier write forgot to maintain (§7).
#
# Same posture as Stage 1: every field is Cognito-only (the API's Cognito mode
# defaults to ALLOW and the API-key mode defaults to DENY, so a field with no
# @aws_ directive is unreachable by the public orders key) and Unit Admin
# authorization lives in the resolver.
# ============================================================================

"""How one product's stock or custody moved. Closed set (spec §5.8); a movement row is append-only and corrections are new linked movements."""
enum InventoryMovementType {
  """Stock received into the campaign's central Kernel balance."""
  RECEIPT
  """Manual signed change to central Kernel stock; always carries a reason."""
  STOCK_ADJUSTMENT
  """Manual signed change to the separate Council-on-order balance."""
  COUNCIL_ON_ORDER_ADJUST
  """Stock reserved to a Show & Sell event."""
  EVENT_ASSIGN
  """Event reservation reduced by an admin."""
  EVENT_MANUAL_REDUCE
  """Event reservation reduced automatically at a limit."""
  EVENT_AUTO_REDUCE
  """Stock sold and handed over during the event itself."""
  EVENT_IMMEDIATE_SALE
  """Unsold event reservation released back to the campaign."""
  EVENT_RELEASE
  """Event stock returned after the event and reconciled to the balance."""
  EVENT_RETURN_RECONCILE
  """Balance correction made when a finalized event is re-opened."""
  EVENT_RE_FINALIZE_ADJUST
  """Stock issued into one Scout's custody."""
  SCOUT_ISSUE
  """Custody consumed by the Scout's own sale."""
  SCOUT_SALE_CONSUME
  """Custody returned by the Scout to central stock."""
  SCOUT_RETURN
  """Stock consumed by an individual Order fulfillment."""
  INDIVIDUAL_FULFILL
  """Stock reserved for a We Owe obligation."""
  WE_OWE_RESERVE
  """A We Owe reservation released back to sellable stock."""
  WE_OWE_RELEASE
  """Stock consumed by fulfilling a We Owe obligation."""
  WE_OWE_FULFILL
  """Reversal of an earlier movement; mirrors the deltas of what it reverses."""
  REVERSAL
}

"""One product's stock position: the §5.7 balance row plus the §7 quantities derived from the open event allocations and custody rows. A product with no balance row yet answers as zeros at version 0."""
type InventoryPosition {
  """The Unit Campaign the balance belongs to."""
  unitCampaignId: ID!
  """The catalog product this balance is for."""
  productId: ID!
  """Central physical Kernel stock, including assigned and We Owe-reserved Kernels."""
  kernelPhysicalQty: Int!
  """Portion of physical stock reserved for We Owe obligations."""
  soldInPossessionQty: Int!
  """Expected Council supply on order for this product; never subtracted automatically."""
  councilOnOrderQty: Int!
  """Balance version, incremented by every stock write; 0 when no balance row exists yet."""
  version: Int!
  """When the balance row was created, or null before the first receipt."""
  createdAt: AWSDateTime
  """When the balance row was last written, or null before the first receipt."""
  updatedAt: AWSDateTime
  """Sellable now: kernelPhysicalQty - soldInPossessionQty."""
  sellableKernelQty: Int!
  """Kernels still owed by open event allocations."""
  assignedOpenQty: Int!
  """Sellable Kernels not claimed by any open allocation: max(0, sellable - assignedOpen)."""
  unassignedKernelQty: Int!
  """Open allocations exceeding sellable stock: max(0, assignedOpen - sellable). A shortage, never a negative unassigned value."""
  assignmentOverageQty: Int!
  """Kernels physically in Scout custody for this product."""
  withScoutQty: Int!
  """Everything the campaign owns for this product and has not delivered: kernelPhysicalQty + withScoutQty."""
  totalUnitOwnedUndeliveredQty: Int!
}

"""A page of inventory positions."""
type InventoryPositionConnection {
  """The positions on this page."""
  items: [InventoryPosition!]!
  """Cursor state for this page."""
  pageInfo: PageInfo!
}

"""Append-only audit record of one inventory change (spec §5.8). Never edited: a correction is a new movement linked to the original."""
type InventoryMovement {
  """The movement's own ID."""
  movementId: ID!
  """The Unit Campaign whose balance moved."""
  unitCampaignId: ID!
  """The product whose balance moved."""
  productId: ID!
  """What kind of change this was."""
  movementType: InventoryMovementType!
  """Signed change to central physical Kernel stock; 0 when not applicable."""
  kernelPhysicalDelta: Int!
  """Signed change to We Owe-reserved central stock; 0 when not applicable."""
  soldPossessionDelta: Int!
  """Signed change to one Scout's custody; 0 when not applicable."""
  withScoutDelta: Int!
  """Explanation of an allocation change; allocations stay authoritative; 0 when not applicable."""
  assignedDelta: Int!
  """Signed change to the separate Council-on-order balance; 0 when not applicable."""
  councilOnOrderDelta: Int!
  """The Scout whose custody or individual fulfillment this is, when applicable."""
  profileId: ID
  """The Show & Sell event this movement belongs to, when applicable."""
  showAndSellId: ID
  """The sale this movement belongs to, when applicable."""
  saleId: ID
  """The individual Order this movement belongs to, when applicable."""
  orderId: ID
  """The We Owe obligation this movement belongs to, when applicable."""
  weOweId: ID
  """The fulfillment this movement belongs to, when applicable."""
  fulfillmentId: ID
  """The finalization this movement belongs to, when applicable."""
  finalizationId: ID
  """Why the change was made; mandatory for manual adjustments and reconciliation."""
  reason: String
  """The account that performed the action."""
  actorAccountId: ID!
  """Business moment of the change."""
  occurredAt: AWSDateTime!
  """The InventoryBalance version this movement produced, or null for a movement that changed no balance."""
  inventoryVersion: Int
  """The idempotency key of the request that wrote this movement."""
  idempotencyKey: String!
}

"""A page of inventory movements, newest first."""
type InventoryMovementConnection {
  """The movements on this page."""
  items: [InventoryMovement!]!
  """Cursor state for this page."""
  pageInfo: PageInfo!
}

"""Inclusive instant window for a history read; at most 366 days wide."""
input DateRangeFilter {
  """First instant to include."""
  startAt: AWSDateTime
  """Last instant to include; must be after startAt."""
  endAt: AWSDateTime
}

"""Input for recordInventoryReceipt. Stock only: no Order, payment, credit, or We Owe effect."""
input RecordInventoryReceiptInput {
  """The Unit Campaign receiving the stock."""
  unitCampaignId: ID!
  """The catalog product received; must be a product of this campaign's catalog."""
  productId: ID!
  """Positive number of Kernels received."""
  quantity: Int!
  """Business moment the stock arrived; defaults to now."""
  occurredAt: AWSDateTime
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for adjustInventory. Signed, never zero, and always explained."""
input AdjustInventoryInput {
  """The Unit Campaign whose stock is changing."""
  unitCampaignId: ID!
  """The product whose central Kernel stock is changing."""
  productId: ID!
  """Signed change to central physical stock; the result must keep kernelPhysicalQty >= soldInPossessionQty >= 0."""
  quantityDelta: Int!
  """Why the stock changed: miscount, damage, gift, trade. Mandatory."""
  reason: String!
  """Business moment of the change; defaults to now."""
  occurredAt: AWSDateTime
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for adjustCouncilOnOrder. Changes the separate on-order balance only, never Kernel stock."""
input AdjustCouncilOnOrderInput {
  """The Unit Campaign whose on-order balance is changing."""
  unitCampaignId: ID!
  """The product the Council has on order."""
  productId: ID!
  """Signed change to councilOnOrderQty; the result cannot be negative."""
  quantityDelta: Int!
  """Why the on-order expectation changed; optional."""
  reason: String
  """Business moment of the change; defaults to now."""
  occurredAt: AWSDateTime
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

# ============================================================================
# Show & Sell — Scout custody (delivery checklist §2.3, data model §5.9)
# ============================================================================

"""One Scout's custody of one product in one Unit Campaign: unsold unit-owned stock issued for individual sales. Stock with a Scout is not sellable Kernel stock until it is returned or consumed by a sale; it still counts in total unit-owned stock (spec CUST-01)."""
type ScoutCustodyBalance {
  """The Unit Campaign the custody belongs to."""
  unitCampaignId: ID!
  """The product the Scout holds."""
  productId: ID!
  """The Scout holding the stock."""
  profileId: ID!
  """The Scout Campaign used for this Scout's individual sales."""
  campaignId: ID!
  """Unsold unit-owned Kernels with this Scout; never negative."""
  withScoutQty: Int!
  """Custody version, incremented by every issue, sale, and return on this row."""
  version: Int!
  """When the custody row was created."""
  createdAt: AWSDateTime
  """When the custody row was last written."""
  updatedAt: AWSDateTime
}

"""A page of Scout custody balances, ordered by product then Scout. Carries the aggregate the inventory board needs alongside the per-Scout rows."""
type ScoutCustodyBalanceConnection {
  """The custody rows on this page."""
  items: [ScoutCustodyBalance!]!
  """Cursor state for this page."""
  pageInfo: PageInfo!
  """Total With Scout quantity across the whole filtered set, not just this page."""
  totalWithScoutQty: Int!
}

"""One product and how many Kernels of it it names."""
input ProductQuantityInput {
  """The product."""
  productId: ID!
  """Positive number of Kernels."""
  quantity: Int!
}

"""Input for issueStockToScout. Moves unassigned Kernel stock into one Scout's custody; never sells anything."""
input IssueStockToScoutInput {
  """The Unit Campaign issuing the stock."""
  unitCampaignId: ID!
  """The Scout Campaign of the roster identity being issued to; must match the roster row."""
  campaignId: ID!
  """The Scout's profile; must be an ACTIVE member of this campaign's roster."""
  profileId: ID!
  """The product being issued."""
  productId: ID!
  """Positive number of Kernels to issue; cannot exceed the unassigned stock."""
  quantity: Int!
  """Business moment of the issue; defaults to now."""
  occurredAt: AWSDateTime
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for returnStockFromScout. One atomic batch: every product returns or none does."""
input ReturnStockFromScoutInput {
  """The Unit Campaign taking the stock back."""
  unitCampaignId: ID!
  """The Scout Campaign the custody was issued under; must match the custody rows."""
  campaignId: ID!
  """The Scout returning the stock. A removed Scout's custody still returns."""
  profileId: ID!
  """Non-empty, at most one entry per product; the batch must fit the 90-action write plan."""
  items: [ProductQuantityInput!]!
  """Business moment of the return; defaults to now."""
  occurredAt: AWSDateTime
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""What one issue produced: the product's stock position and the Scout's custody."""
type IssueStockToScoutPayload {
  """The product's position after the issue: Kernel stock down, With Scout up."""
  inventoryPosition: InventoryPosition!
  """The Scout's custody row after the issue."""
  custodyBalance: ScoutCustodyBalance!
}

"""What one return batch produced, in the order the request named its products."""
type ReturnStockFromScoutPayload {
  """Each returned product's position, with Kernel stock back up."""
  inventoryPositions: [InventoryPosition!]!
  """Each returned product's custody row for that Scout."""
  custodyBalances: [ScoutCustodyBalance!]!
}

# === Show & Sell — individual Order fulfillment (delivery checklist §2.4, data model §5.19) ===
# Authorization lives in the resolver: Unit Admin for the Order's IMMUTABLE
# originating Unit, read off the Order row itself, never off a Unit id the caller
# supplies (AUTH-U). The Order's `fulfillmentVersion` is the serialization point
# for fulfill, reverse, and a line edit against one Order.

"""Input for fulfillIndividualOrderLine. Fills part or all of one individual Order line from a Kernel-chosen source."""
input FulfillIndividualOrderLineInput {
  """The Order whose line is fulfilled. Its own immutable Unit scope decides whose admin may act."""
  orderId: ID!
  """The stable line identity (§5.19). A pre-Wave-3 line carries no identity, so nothing can name it."""
  lineItemId: ID!
  """Kernels fulfilled on this line; cannot exceed the line's still-unfulfilled quantity."""
  quantity: Int!
  """KERNEL_STOCK consumes unassigned Kernel stock; EXTERNAL_COUNCIL consumes no Kernel stock at all. SCOUT_CUSTODY is consumed by the sale itself, so it is not a choice here."""
  source: OrderFulfillmentSource!
  """The Order.fulfillmentVersion this caller read. A stale value conflicts instead of double-fulfilling one line."""
  expectedFulfillmentVersion: Int!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for reverseIndividualOrderFulfillment. Undoes one fulfillment and returns only the stock source it took."""
input ReverseIndividualOrderFulfillmentInput {
  """The Order the fulfillment belongs to."""
  orderId: ID!
  """The FULFILL record to reverse. A REVERSAL cannot be reversed."""
  fulfillmentId: ID!
  """The Order.fulfillmentVersion this caller read."""
  expectedFulfillmentVersion: Int!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""What one fulfillment produced. `inventoryPosition` is absent exactly when the source moved no Kernel stock."""
type FulfillIndividualOrderLinePayload {
  """The Order after the fulfillment, with the line's fulfilledQuantity and fulfillmentVersion moved."""
  order: Order!
  """The append-only FULFILL record this request wrote."""
  fulfillment: OrderFulfillment!
  """The product's stock position, present only for a KERNEL_STOCK fulfillment."""
  inventoryPosition: InventoryPosition
}

"""What one reversal produced. `inventoryPosition` is absent exactly when the reversed source moved no Kernel stock."""
type ReverseIndividualOrderFulfillmentPayload {
  """The Order after the reversal, with the line's fulfilledQuantity back down and fulfillmentVersion moved."""
  order: Order!
  """The append-only REVERSAL record this request wrote, linked to the fulfillment it undoes."""
  reversal: OrderFulfillment!
  """The product's stock position, present only when the reversed source was KERNEL_STOCK."""
  inventoryPosition: InventoryPosition
}

"""One Order's full fulfillment and reversal audit history, oldest first."""
type OrderFulfillmentConnection {
  """The fulfillment and reversal records, with the administrative audit fields."""
  items: [OrderFulfillment!]!
  """Pagination state for this read."""
  pageInfo: PageInfo!
}

"""One individual Order in the projection a Unit Admin fulfills (§2.4, §5.19): the Order, the immutable Unit scope it was taken under, and each line's stable identity with its fulfilled quantity. Deliberately not the legacy `Order` shape - customer contact details are not part of administering stock, and this projection carries none of them."""
type UnitOrder {
  """The Order ID."""
  orderId: ID!
  """The Scout who took the Order."""
  profileId: ID!
  """The Scout Campaign the Order was placed under."""
  campaignId: ID!
  """The Unit that owns the stock: the origin captured at sale time (API-FIX-05)."""
  unitId: ID!
  """The Unit Campaign that is this Order's immutable origin."""
  unitCampaignId: ID!
  """The customer name the Scout recorded on the Order."""
  customerName: String!
  """Business moment of the Order."""
  orderDate: AWSDateTime!
  """Serialization version for fulfilling and reversing this Order's lines (§5.19). Rows written before Wave 3 carry no value, which reads as 0."""
  fulfillmentVersion: Int
  """The Order's lines, each with the identity a fulfillment names."""
  lineItems: [UnitOrderLine!]!
}

"""One line of a Unit-scope Order: what was ordered, the stable id a fulfillment names, and how much of it is already fulfilled."""
type UnitOrderLine {
  """The stable line identity (§5.19). A row written before stable line ids carries none, and such a line cannot be fulfilled by name."""
  lineItemId: ID
  """The product this line names."""
  productId: ID!
  """The product's name as the Order recorded it."""
  productName: String!
  """Kernels ordered on this line."""
  quantity: Int!
  """Kernels already fulfilled on this line. A row written before Wave 3 carries none, and is answered as 0."""
  fulfilledQuantity: Int!
}

"""A page of one Unit Campaign's individual Orders, newest first."""
type UnitOrderConnection {
  """The Orders on this page."""
  items: [UnitOrder!]!
  """Cursor state for this page."""
  pageInfo: PageInfo!
}

# ============================================================================
# Query Root
# ============================================================================

"""The root query object for the KernelWorx API."""
type Query {
  # Show & Sell — Units and Unit Campaigns (Stage 1)
  """The Units on which the caller holds a Unit Admin grant. No cross-Unit data."""
  myUnits(
    """Pagination parameters."""
    page: PageInput
  ): UnitConnection!
  """The unit's settings and admin count. Unit Admin for that Unit."""
  unit(
    """The Unit ID."""
    unitId: ID!
  ): Unit
  """The unit's admin grants; account email/name limited to administration needs. Unit Admin."""
  unitAdmins(
    """The Unit ID."""
    unitId: ID!
    """Pagination parameters."""
    page: PageInput
  ): UnitAccessGrantConnection!
  """The unit's active, unused invites; the code is returned only for them. Unit Admin."""
  unitInvites(
    """The Unit ID."""
    unitId: ID!
    """Pagination parameters."""
    page: PageInput
  ): UnitInviteConnection!
  """The member-safe preview of a campaign from its join code; any authenticated account. No inventory, roster, or grant data."""
  unitCampaignJoinInfo(
    """The campaign join code."""
    joinCode: String!
  ): UnitCampaignJoinPreview
  """The campaign's join code and settings. Unit Admin for the parent Unit."""
  unitCampaign(
    """The Unit Campaign ID."""
    unitCampaignId: ID!
  ): UnitCampaignAdmin
  """The campaign's catalog and product inputs for browser sales sheets. Unit Admin for the parent Unit."""
  unitCampaignCatalog(
    """The Unit Campaign ID."""
    unitCampaignId: ID!
  ): UnitCampaignCatalog
  """A Unit's campaigns. Unit Admin for the parent Unit."""
  unitCampaigns(
    """The parent Unit ID."""
    unitId: ID!
    """Filter by active state."""
    isActive: Boolean
    """Pagination parameters."""
    page: PageInput
  ): UnitCampaignConnection!
  """A Unit Campaign's roster, including removed history. Unit Admin for the parent Unit."""
  unitCampaignRoster(
    """The Unit Campaign ID."""
    unitCampaignId: ID!
    """Filter by roster status."""
    status: MembershipStatus
    """Pagination parameters."""
    page: PageInput
  ): UnitCampaignMembershipConnection!

  # Show & Sell — inventory balances and audit (Stage 2)
  """What a Unit Campaign holds per product, with the derived quantities computed server-side. Unit Admin for the parent Unit."""
  inventoryPositions(
    """The Unit Campaign ID."""
    unitCampaignId: ID!
    """Limit the page to these products (at most 15). Omit for every product the campaign has inventory rows for."""
    productIds: [ID!]
    """Pagination parameters."""
    page: PageInput
  ): InventoryPositionConnection!
  """One Unit Campaign's inventory movement history, newest first. Unit Admin for the parent Unit."""
  inventoryMovements(
    """The Unit Campaign ID."""
    unitCampaignId: ID!
    """Filter to one product's history."""
    productId: ID
    """Filter to one movement type."""
    movementType: InventoryMovementType
    """Filter to one Show & Sell event's movements."""
    showAndSellId: ID
    """Filter to one Scout's custody and fulfillment movements."""
    profileId: ID
    """Inclusive window of business moments; at most 366 days wide."""
    dateRange: DateRangeFilter
    """Pagination parameters."""
    page: PageInput
  ): InventoryMovementConnection!
  """What a Unit Campaign has out with its Scouts, per Scout and in aggregate. Unit Admin for the parent Unit."""
  scoutCustodyBalances(
    """The Unit Campaign ID."""
    unitCampaignId: ID!
    """Filter to one Scout's custody rows."""
    profileId: ID
    """Filter to one product's custody rows."""
    productId: ID
    """Pagination parameters."""
    page: PageInput
  ): ScoutCustodyBalanceConnection!
  """One Scout's own custody in one Unit Campaign. Profile Owner/WRITE/READ for that Scout, or Unit Admin for the parent Unit; never another Scout's rows."""
  myScoutCustody(
    """The Scout's profile ID."""
    profileId: ID!
    """The Unit Campaign ID."""
    unitCampaignId: ID!
  ): [ScoutCustodyBalance!]!
  """One Order's full fulfillment and reversal audit, oldest first, including who recorded each record and which inventory movement moved the stock. Unit Admin for the Order's immutable originating Unit; a participant reads the audit-free `Order.fulfillments` instead (§10.2)."""
  orderFulfillments(
    """The Order ID."""
    orderId: ID!
    """Pagination parameters."""
    page: PageInput
  ): OrderFulfillmentConnection!
  """The individual Orders one Scout Campaign holds for this Unit Campaign, newest first, in the projection a fulfillment write needs: origin scope, the stable line identity, each line's fulfilled quantity, and the version the next fulfillment conditions on. Unit Admin for the Unit Campaign, which is the Order's immutable origin; Orders another Unit took under the same Scout Campaign are not answered here, and no customer contact detail is."""
  unitScoutCampaignOrders(
    """The Unit Campaign whose admin is asking."""
    unitCampaignId: ID!
    """The Scout Campaign the Orders were placed under."""
    campaignId: ID!
    """Pagination parameters."""
    page: PageInput
  ): UnitOrderConnection!

  # Account queries
  """The authenticated caller's account. The row is created automatically on first read if it does not yet exist."""
  getMyAccount: Account!

  # Profile queries
  """Fetch a single seller profile by ID. Returns the profile if the caller owns it or has read access via a share, otherwise null."""
  getProfile(
    """The profile's ID."""
    profileId: ID!
  ): SellerProfile
  """List the seller profiles the caller owns, with pagination."""
  listMyProfiles(
    """Maximum number of items to return in the page."""
    limit: Int,
    """Opaque cursor from a previous page; omit to start from the first page."""
    nextToken: String
  ): SellerProfileConnection!
  """List seller profiles that have been shared to the caller, each annotated with the caller's permissions."""
  listMyShares: [SharedProfile!]!
  """Owner-facing settings for one campaign's public order surface. Owner-only on read and write."""
  getCampaignPublicOrderSettings(
    """The campaign's ID."""
    campaignId: ID!
  ): PublicOrderSettings @aws_cognito_user_pools

  # Campaign queries
  """Fetch a single campaign by ID. Returns the campaign if the caller has read access to its profile, otherwise null."""
  getCampaign(
    """The campaign's ID."""
    campaignId: ID!
  ): Campaign
  """List the campaigns on a profile, with pagination. The caller must have read access to the profile."""
  listCampaignsByProfile(
    """The profile's ID."""
    profileId: ID!,
    """Maximum number of items to return in the page."""
    limit: Int,
    """Opaque cursor from a previous page; omit to start from the first page."""
    nextToken: String
  ): CampaignConnection!

  # Catalog queries
  """Fetch a single catalog by ID. Returns the catalog only when it is public, admin-managed (ADMIN_MANAGED), or owned by the caller; returns null otherwise."""
  getCatalog(
    """The catalog's ID."""
    catalogId: ID!
  ): Catalog @aws_cognito_user_pools
  """List the public, admin-managed catalogs available to all users (soft-deleted catalogs excluded)."""
  listManagedCatalogs: [Catalog!]! @aws_cognito_user_pools
  """List the catalogs the caller has created (soft-deleted catalogs excluded)."""
  listMyCatalogs: [Catalog!]!
  """Return the IDs of every catalog used by a campaign the caller owns or has access to via a share."""
  listCatalogsInUse: [ID!]!

  # Order queries
  """Fetch a single order by ID. Returns the order if the caller has read access to its profile, otherwise null."""
  getOrder(
    """The order's ID."""
    orderId: ID!
  ): Order
  """List the orders in a campaign, with pagination. The caller must have read access to the campaign's profile."""
  listOrdersByCampaign(
    """The campaign's ID."""
    campaignId: ID!,
    """Maximum number of items to return in the page."""
    limit: Int,
    """Opaque cursor from a previous page; omit to start from the first page."""
    nextToken: String
  ): OrderConnection!

  # Public order queries (API key auth mode; the token argument is the authorization)
  """Fetch the public order page's offer: seller, campaign, catalog products, and allowed payment methods. A campaign that never enabled public orders, is disabled, or carries a token mismatch all return the same NOT_FOUND, so probing cannot distinguish them."""
  publicGetOrderOffer(
    """The campaign's ID in bare (unprefixed) form."""
    campaignId: ID!,
    """The share token from the public URL."""
    token: String!
  ): PublicOrderOffer! @aws_api_key
  """Fetch the buyer's receipt for a public order. Served to an API-key caller; the receipt token in the URL is the authorization. An unknown campaign/suffix, an absent or mismatched token, and a token that does not match the order all return the same NOT_FOUND."""
  publicGetOrderReceipt(
    """The campaign's ID in bare (unprefixed) form."""
    campaignId: ID!,
    """The order's suffix (the third and final segment of the order's full ID)."""
    orderSuffix: String!,
    """The receipt token from the receipt URL."""
    receiptToken: String!
  ): PublicOrderReceiptLookup! @aws_api_key

  # Share queries
  """List the shares (access grants) on a profile. The caller must have write access to the profile."""
  listSharesByProfile(
    """The profile's ID."""
    profileId: ID!
  ): [Share!]!
  """List the pending invites on a profile. Owner only: a caller whose write access comes from a share is not authorized to list invites and receives an empty list."""
  listInvitesByProfile(
    """The profile's ID."""
    profileId: ID!
  ): [ProfileInvite!]!

  # Shared campaign queries
  """Fetch a single shared campaign by its bearer code. Returns null when the code is unknown or the shared campaign is inactive."""
  getSharedCampaign(
    """The shared campaign's code."""
    sharedCampaignCode: String!
  ): SharedCampaign @aws_cognito_user_pools
  """List the active shared campaigns the caller has created, most recent first."""
  listMySharedCampaigns: [SharedCampaign!]!
  """Find active shared campaigns that exactly match the given unit and season (unitType, unitNumber, city, state, campaignName, and campaignYear). Inactive shared campaigns are excluded."""
  findSharedCampaigns(
    """The scout unit type."""
    unitType: String!,
    """The scout unit number."""
    unitNumber: Int!,
    """The city."""
    city: String!,
    """The state."""
    state: String!,
    """The campaign name to match (for example "Fall" or "Spring")."""
    campaignName: String!,
    """The campaign year to match (for example 2024)."""
    campaignYear: Int!
  ): [SharedCampaign!]!

  """Generate a unit-level sales report for a unit and season, covering only the sellers (profiles) the caller can read. catalogId is required so the report reflects a single catalog."""
  getUnitReport(
    """The scout unit type."""
    unitType: String!,
    """The scout unit number."""
    unitNumber: Int!,
    """The city, to identify the unit."""
    city: String,
    """The state, to identify the unit."""
    state: String,
    """The campaign name (for example "Fall" or "Spring")."""
    campaignName: String!,
    """The campaign year (for example 2024)."""
    campaignYear: Int!,
    """The catalog ID to build the report from."""
    catalogId: ID!
  ): UnitReport

  # Payment method queries
  """The payment methods available to the caller: the caller's stored custom methods plus the built-in "Cash" and "Check" methods, sorted by name."""
  myPaymentMethods: [PaymentMethod!]!
  """The payment methods stored for a profile's owner. The caller must have access to the profile; READ-only callers see the method names but not their QR codes (qrCodeUrl is null)."""
  paymentMethodsForProfile(
    """The profile's ID."""
    profileId: ID!
  ): [PaymentMethod!]!

  # Admin queries (requires the ADMIN Cognito group)
  """List all Cognito users, merged with their stored Account data, with pagination (admin only)."""
  adminListUsers(
    """Maximum number of users to return in the page."""
    limit: Int,
    """Opaque cursor from a previous page; omit to start from the first page."""
    nextToken: String
  ): AdminUserConnection!
  """Search users by email, name, or accountId (admin only)."""
  adminSearchUser(
    """The text to search for (matches email, display name, or account ID; at least 3 characters)."""
    query: String!
  ): [AdminUser!]!
  """List all seller profiles owned by the given account (admin only)."""
  adminGetUserProfiles(
    """The account ID to look up."""
    accountId: ID!
  ): [SellerProfile!]!
  """List all catalogs owned by the given account (admin only)."""
  adminGetUserCatalogs(
    """The account ID to look up."""
    accountId: ID!
  ): [Catalog!]!
  """List all campaigns owned by the given account (admin only)."""
  adminGetUserCampaigns(
    """The account ID to look up."""
    accountId: ID!
  ): [Campaign!]!
  """List all shared campaigns created by the given account (admin only)."""
  adminGetUserSharedCampaigns(
    """The account ID to look up."""
    accountId: ID!
  ): [SharedCampaign!]!
  """List all shares (access grants) on a profile (admin only)."""
  adminGetProfileShares(
    """The profile's ID."""
    profileId: ID!
  ): [Share!]!
}

# ============================================================================
# Mutation Root
# ============================================================================

"""The root mutation object for the KernelWorx API."""
type Mutation {
  # Show & Sell — Units and Unit Campaigns (Stage 1)
  """Create a unit; the caller becomes its initial Unit Admin. Returns the Unit and the creator grant."""
  createUnit(
    """The unit to create."""
    input: CreateUnitInput!
  ): CreateUnitPayload!
  """Update a unit's metadata and settings. Unit Admin for that Unit."""
  updateUnit(
    """The unit update."""
    input: UpdateUnitInput!
  ): Unit!
  """Generate a 16-character, 14-day, single-use unit admin invite. Unit Admin for that Unit."""
  createUnitInvite(
    """The invite to create."""
    input: CreateUnitInviteInput!
  ): UnitInvite!
  """Revoke an unused unit invite. Unit Admin for that Unit."""
  revokeUnitInvite(
    """The invite to revoke."""
    input: RevokeUnitInviteInput!
  ): Boolean!
  """Redeem a single-use, unexpired invite to become a Unit Admin. Any authenticated account."""
  redeemUnitInvite(
    """The invite to redeem."""
    input: RedeemUnitInviteInput!
  ): UnitAccessGrant!
  """Revoke a Unit Admin grant; the last grant returns CONFLICT. Unit Admin for that Unit."""
  revokeUnitAccessGrant(
    """The grant to revoke."""
    input: RevokeUnitAccessGrantInput!
  ): Unit!
  """Create a Unit Campaign. Unit Admin for the parent Unit."""
  createUnitCampaign(
    """The campaign to create."""
    input: CreateUnitCampaignInput!
  ): UnitCampaignAdmin!
  """Update a Unit Campaign's name, year, and active state. Unit Admin for the parent Unit."""
  updateUnitCampaign(
    """The campaign update."""
    input: UpdateUnitCampaignInput!
  ): UnitCampaignAdmin!
  """Join a Unit Campaign with a join code. Any authenticated account with Owner or WRITE on the Scout."""
  joinUnitCampaign(
    """The join request."""
    input: JoinUnitCampaignInput!
  ): UnitCampaignMembership!
  """Remove a Scout from a Unit Campaign roster (sets REMOVED). Unit Admin for the parent Unit."""
  removeUnitCampaignMembership(
    """The removal request."""
    input: RemoveUnitCampaignMembershipInput!
  ): UnitCampaignMembership!

  # Show & Sell — inventory balances (Stage 2)
  """Receive stock for one catalog product. Unit Admin for the parent Unit; creates no Order, payment, credit, or We Owe obligation."""
  recordInventoryReceipt(
    """The receipt."""
    input: RecordInventoryReceiptInput!
  ): InventoryPosition!
  """Adjust a product's central Kernel stock by a signed amount, with a mandatory reason. Unit Admin for the parent Unit."""
  adjustInventory(
    """The adjustment."""
    input: AdjustInventoryInput!
  ): InventoryPosition!
  """Adjust the separate Council-on-order balance by a signed amount. Unit Admin for the parent Unit; never changes Kernel stock."""
  adjustCouncilOnOrder(
    """The on-order adjustment."""
    input: AdjustCouncilOnOrderInput!
  ): InventoryPosition!
  """Issue unassigned Kernel stock to an ACTIVE Scout on this campaign's roster. Unit Admin for the parent Unit; Kernel stock down, With Scout up, total unit-owned stock unchanged, and no Order, sale, credit, or We Owe effect."""
  issueStockToScout(
    """The issue."""
    input: IssueStockToScoutInput!
  ): IssueStockToScoutPayload!
  """Return one Scout's unsold custody to Kernel stock as one atomic batch: any over-return or oversized batch refuses the whole request. Unit Admin for the parent Unit."""
  returnStockFromScout(
    """The return batch."""
    input: ReturnStockFromScoutInput!
  ): ReturnStockFromScoutPayload!
  """Fulfill part or all of one individual Order line from Kernel stock or an external Council supply. Unit Admin for the Order's immutable originating Unit. Kernel stock is taken only for KERNEL_STOCK, and never more than the line still owes (§5.19)."""
  fulfillIndividualOrderLine(
    """The fulfillment."""
    input: FulfillIndividualOrderLineInput!
  ): FulfillIndividualOrderLinePayload!
  """Undo one fulfillment, restoring the line's unfulfilled quantity and only the stock source that fulfillment took. Unit Admin for the Order's immutable originating Unit. At most one reversal exists per fulfillment, and the deterministic key is what enforces it."""
  reverseIndividualOrderFulfillment(
    """The reversal."""
    input: ReverseIndividualOrderFulfillmentInput!
  ): ReverseIndividualOrderFulfillmentPayload!

  # Account mutations
  """Update profile fields on the caller's own account. At least one field must be provided. Returns the updated account."""
  updateMyAccount(
    """The fields to update."""
    input: UpdateMyAccountInput!
  ): Account!
  """Replace the caller's account preferences blob. Returns the updated account."""
  updateMyPreferences(
    """The new preferences value."""
    preferences: AWSJSON!
  ): Account!
  """Delete the caller's account and all associated data (profiles, campaigns, orders, shares, and invites; catalogs are preserved) and remove the user from Cognito. Returns true on success."""
  deleteMyAccount: Boolean!

  # Profile mutations
  """Create a new seller profile owned by the caller. Returns the created profile."""
  createSellerProfile(
    """The new profile's details."""
    input: CreateSellerProfileInput!
  ): SellerProfile!
  """Update a seller profile the caller owns. Returns the updated profile."""
  updateSellerProfile(
    """The profile ID and new details."""
    input: UpdateSellerProfileInput!
  ): SellerProfile!
  """Delete a seller profile the caller owns, along with all of its campaigns, orders, shares, and invites. Returns true on success."""
  deleteSellerProfile(
    """The profile's ID."""
    profileId: ID!
  ): Boolean!
  # Campaign mutations
  """Create a new active campaign on a profile the caller has write access to. Returns the created campaign."""
  createCampaign(
    """The new campaign's details."""
    input: CreateCampaignInput!
  ): Campaign!
  """Update a campaign on a profile the caller has write access to. Only provided fields change. Returns the updated campaign."""
  updateCampaign(
    """The campaign ID and fields to update."""
    input: UpdateCampaignInput!
  ): Campaign!
  """Delete a campaign and all of its orders, on a profile the caller has write access to. Returns true on success."""
  deleteCampaign(
    """The campaign's ID."""
    campaignId: ID!
  ): Boolean!
  """Enable, configure, or disable one campaign's public order surface. Owner only (share collaborators are FORBIDDEN). Enabling requires the campaign to be active, its catalog to exist and not be soft-deleted, and a non-empty method list, and re-requires the acknowledgements when the stored version is behind. Disabling keeps the share token so the URL stays stable; rotateToken mints a replacement."""
  updateCampaignPublicOrderSettings(
    """The campaign and the public-order settings to apply."""
    input: UpdateCampaignPublicOrderSettingsInput!
  ): PublicOrderSettings! @aws_cognito_user_pools

  # Public order mutations (API key auth mode; anonymous)
  """Place a public order on a campaign whose share token is in the request. Returns the buyer's receipt. A never-enabled campaign, a disabled campaign, and a bad token all return NOT_FOUND so probing cannot distinguish them; a campaign at its order cap returns PUBLIC_ORDER_LIMIT_EXCEEDED."""
  publicCreateOrder(
    """The anonymous order input, carrying the campaign's share token."""
    input: PublicCreateOrderInput!
  ): PublicOrderReceipt! @aws_api_key

  # Catalog mutations
  """Create a catalog owned by the caller. Returns the created catalog."""
  createCatalog(
    """The new catalog's details and products."""
    input: CreateCatalogInput!
  ): Catalog!
  """Update a catalog the caller owns, replacing its name, visibility, and products. Returns the updated catalog."""
  updateCatalog(
    """The catalog's ID."""
    catalogId: ID!,
    """The new catalog's details and products."""
    input: CreateCatalogInput!
  ): Catalog!
  """Soft-delete a catalog the caller owns (it is hidden from list queries but kept for reference). Returns true on success."""
  deleteCatalog(
    """The catalog's ID."""
    catalogId: ID!
  ): Boolean!

  # Order mutations
  """Place a new order in a campaign on a profile the caller has write access to. Returns the created order."""
  createOrder(
    """The new order's details."""
    input: CreateOrderInput!
  ): Order!
  """Update an order on a profile the caller has write access to. Only provided fields change. Returns the updated order."""
  updateOrder(
    """The order ID and fields to update."""
    input: UpdateOrderInput!
  ): Order!
  """Delete an order on a profile the caller has write access to. Returns true on success."""
  deleteOrder(
    """The order's ID."""
    orderId: ID!
  ): Boolean!


  # Shared campaign mutations
  """Create a shared campaign so other units can find and clone it. Returns the created shared campaign."""
  createSharedCampaign(
    """The new shared campaign's details."""
    input: CreateSharedCampaignInput!
  ): SharedCampaign!

  """Update a shared campaign the caller created. Only provided fields change. Returns the updated shared campaign."""
  updateSharedCampaign(
    """The shared campaign's code and fields to update."""
    input: UpdateSharedCampaignInput!
  ): SharedCampaign!

  """Delete a shared campaign the caller created. Returns true on success."""
  deleteSharedCampaign(
    """The shared campaign's code."""
    sharedCampaignCode: String!
  ): Boolean!

  # Sharing mutations
  """Create a redeemable invite to join a profile the caller owns. Returns the created invite."""
  createProfileInvite(
    """The new invite's details."""
    input: CreateProfileInviteInput!
  ): ProfileInvite!
  """Delete (revoke) an invite on a profile the caller owns. Returns true on success."""
  deleteProfileInvite(
    """The profile's ID."""
    profileId: ID!,
    """The invite's code."""
    inviteCode: ID!
  ): Boolean!
  """Redeem an invite code to grant the caller access to a profile. Returns the created share."""
  redeemProfileInvite(
    """The invite code to redeem."""
    input: RedeemProfileInviteInput!
  ): Share!
  """Share a profile the caller owns directly with another account by email. Returns the created share."""
  shareProfileDirect(
    """The profile, target email, and permissions."""
    input: ShareProfileDirectInput!
  ): Share!
  """Remove a share's access to a profile the caller owns. Returns true on success."""
  revokeShare(
    """The profile and account whose access should be revoked."""
    input: RevokeShareInput!
  ): Boolean!
  """Transfer a profile's ownership to an account that already has a share (the caller must be the owner or an admin). Returns the updated profile."""
  transferProfileOwnership(
    """The profile and the new owner's account ID."""
    input: TransferProfileOwnershipInput!
  ): SellerProfile!

  # Payment method mutations
  """Create a new payment method for the caller. The name must be unique and not a reserved name (Cash or Check). Returns the created payment method."""
  createPaymentMethod(
    """The new payment method's name."""
    name: String!
  ): PaymentMethod!
  """Rename one of the caller's payment methods. Returns the updated payment method."""
  updatePaymentMethod(
    """The current payment method's name."""
    currentName: String!,
    """The new name for the payment method."""
    newName: String!
  ): PaymentMethod!
  """Delete one of the caller's payment methods and its stored QR code. Returns true on success."""
  deletePaymentMethod(
    """The payment method's name."""
    name: String!
  ): Boolean!
  """Get pre-signed S3 credentials to upload a QR code for one of the caller's payment methods."""
  requestPaymentMethodQRCodeUpload(
    """The payment method's name."""
    paymentMethodName: String!
  ): S3UploadInfo!
  """Confirm a QR code upload for a payment method after the S3 upload completes. Returns the updated payment method."""
  confirmPaymentMethodQRCodeUpload(
    """The payment method's name."""
    paymentMethodName: String!,
    """The S3 key returned by requestPaymentMethodQRCodeUpload."""
    s3Key: String!
  ): PaymentMethod!
  """Delete the stored QR code for a payment method. Returns true on success."""
  deletePaymentMethodQRCode(
    """The payment method's name."""
    paymentMethodName: String!
  ): Boolean!

  # Admin mutations (requires the ADMIN Cognito group)
  """Send a password-reset email to a user by email (admin only). Returns true once the reset is initiated."""
  adminResetUserPassword(
    """The user's email address."""
    email: AWSEmail!
  ): Boolean!
  """Delete the account record and the Cognito user for an account whose per-entity data the caller has already deleted (admin only). The caller cannot purge their own account. Catalogs are never deleted. Returns true on success."""
  adminPurgeUserAccount(
    """The account ID to delete."""
    accountId: ID!
    """The profile IDs the caller read via adminGetUserProfiles before deleting the profile rows. The purge refuses with CONFLICT while any of them still exists, then sweeps the profile-keyed residue the browser cannot reach."""
    profileIds: [ID!]!
  ): Boolean!
  """Delete all orders across all campaigns of all profiles owned by the given account (admin only). Returns the number of orders deleted."""
  adminDeleteUserOrders(
    """The account ID to clean up."""
    accountId: ID!
  ): Int!
  """Delete all campaigns across all profiles owned by the given account (admin only). Returns the number of campaigns deleted."""
  adminDeleteUserCampaigns(
    """The account ID to clean up."""
    accountId: ID!
  ): Int!
  """Delete all shares across all profiles owned by the given account (admin only). Returns the number of shares deleted."""
  adminDeleteUserShares(
    """The account ID to clean up."""
    accountId: ID!
  ): Int!
  """Delete all profiles owned by the given account (admin only). Returns the number of profiles deleted."""
  adminDeleteUserProfiles(
    """The account ID to clean up."""
    accountId: ID!
  ): Int!
  """Delete a specific share, revoking that account's access to a profile (admin only). Returns true on success."""
  adminDeleteShare(
    """The profile's ID."""
    profileId: ID!,
    """The account whose access should be revoked."""
    targetAccountId: ID!
  ): Boolean!
  """Set or clear a campaign's sharedCampaignCode, associating it with a shared campaign (admin only). Returns the updated campaign."""
  adminUpdateCampaignSharedCode(
    """The campaign's ID."""
    campaignId: ID!,
    """The shared campaign's code to associate, or null to clear it."""
    sharedCampaignCode: String
  ): Campaign!
  """Create an admin-managed global catalog available to all users (admin only). Returns the created catalog."""
  createManagedCatalog(
    """The new catalog's details and products."""
    input: CreateCatalogInput!
  ): Catalog!
}

