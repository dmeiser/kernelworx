type OrderOrigin {
  """Where the order's demand originates. COUNCIL = a legacy/independent Scout Campaign; UNIT_CAMPAIGN = a joined Show & Sell Unit Campaign."""
  kind: String!
  """The originating Unit Campaign id (kind = UNIT_CAMPAIGN), else null."""
  unitCampaignId: ID
  """The originating Scout Campaign id (the order's own campaignId for COUNCIL; the joined campaign for UNIT_CAMPAIGN), else null."""
  sourceCampaignId: ID
}

# Show & Sell (spec docs/specs/show_sell, GraphQL API section 4 additions).
# New constructs ONLY in this wave: models, inputs, enums for Units, Unit
# Campaigns, inventory, events, sales, We Owe, finalization, participant
# projections, and order fulfillment. Root Query/Mutation fields, legacy
# surface changes (Order/Campaign origin+fulfillment fields), and legacy
# report deprecation land in later waves per
# docs/SHOW_SELL_INTEGRATION_PLAN.md. All types here are Cognito-only by
# default (no @aws_api_key), per the impact map. New money is integer
# cents; no Float is introduced anywhere in this section.
# Ported from the gate-proven clean-room SDL (branch show-sell-cleanroom,
# graphql/schema.graphql) unchanged except section banner.
# ============================================================================

enum UnitRole {
  UNIT_ADMIN
}

enum MembershipStatus {
  ACTIVE
  REMOVED
}

enum SplitMethod {
  EQUAL
  TIME_WORKED
}

enum CouncilNeedBasis {
  PHYSICAL_STOCK
  AFTER_ASSIGNMENTS
}

