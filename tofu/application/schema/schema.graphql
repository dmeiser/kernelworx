# ============================================================================
# Show & Sell and inventory — Stage 2: inventory balances, receipt, adjustment
#
# The §5.7 balance and §5.8 audit trail for one Unit Campaign's products. The
# balance is one row per (unitCampaignId, productId); every change to it appends an
# InventoryMovement that says which quantity moved, who moved it, and why. The
# assigned/unassigned/overage/With-Scout numbers are never stored: a position is
# computed server-side from the open event allocations and the custody rows, so a
# page cannot display a counter some earlier write forgot to maintain (§7).
#
# Same posture as Stage 1: every field is Cognito-only (the API's Cognito mode
# defaults to ALLOW and the API-key mode defaults to DENY, so a field with no
# @aws_ directive is unreachable by the public orders key) and Unit Admin
# authorization lives in the resolver.
# ============================================================================

"""How one product's stock or custody moved. Closed set (spec §5.8); a movement row is append-only and corrections are new linked movements."""
enum InventoryMovementType {
  """Stock received into the campaign's central Kernel balance."""
  RECEIPT
  """Manual signed change to central Kernel stock; always carries a reason."""
  STOCK_ADJUSTMENT
  """Manual signed change to the separate Council-on-order balance."""
  COUNCIL_ON_ORDER_ADJUST
  """Stock reserved to a Show & Sell event."""
  EVENT_ASSIGN
  """Event reservation reduced by an admin."""
  EVENT_MANUAL_REDUCE
  """Event reservation reduced automatically at a limit."""
  EVENT_AUTO_REDUCE
  """Stock sold and handed over during the event itself."""
  EVENT_IMMEDIATE_SALE
  """Unsold event reservation released back to the campaign."""
  EVENT_RELEASE
  """Event stock returned after the event and reconciled to the balance."""
  EVENT_RETURN_RECONCILE
  """Balance correction made when a finalized event is re-opened."""
  EVENT_RE_FINALIZE_ADJUST
  """Stock issued into one Scout's custody."""
  SCOUT_ISSUE
  """Custody consumed by the Scout's own sale."""
  SCOUT_SALE_CONSUME
  """Custody returned by the Scout to central stock."""
  SCOUT_RETURN
  """Stock consumed by an individual Order fulfillment."""
  INDIVIDUAL_FULFILL
  """Stock reserved for a We Owe obligation."""
  WE_OWE_RESERVE
  """A We Owe reservation released back to sellable stock."""
  WE_OWE_RELEASE
  """Stock consumed by fulfilling a We Owe obligation."""
  WE_OWE_FULFILL
  """Reversal of an earlier movement; mirrors the deltas of what it reverses."""
  REVERSAL
}

"""One product's stock position: the §5.7 balance row plus the §7 quantities derived from the open event allocations and custody rows. A product with no balance row yet answers as zeros at version 0."""
type InventoryPosition {
  """The Unit Campaign the balance belongs to."""
  unitCampaignId: ID!
  """The catalog product this balance is for."""
  productId: ID!
  """Central physical Kernel stock, including assigned and We Owe-reserved Kernels."""
  kernelPhysicalQty: Int!
  """Portion of physical stock reserved for We Owe obligations."""
  soldInPossessionQty: Int!
  """Expected Council supply on order for this product; never subtracted automatically."""
  councilOnOrderQty: Int!
  """Balance version, incremented by every stock write; 0 when no balance row exists yet."""
  version: Int!
  """When the balance row was created, or null before the first receipt."""
  createdAt: AWSDateTime
  """When the balance row was last written, or null before the first receipt."""
  updatedAt: AWSDateTime
  """Sellable now: kernelPhysicalQty - soldInPossessionQty."""
  sellableKernelQty: Int!
  """Kernels still owed by open event allocations."""
  assignedOpenQty: Int!
  """Sellable Kernels not claimed by any open allocation: max(0, sellable - assignedOpen)."""
  unassignedKernelQty: Int!
  """Open allocations exceeding sellable stock: max(0, assignedOpen - sellable). A shortage, never a negative unassigned value."""
  assignmentOverageQty: Int!
  """Kernels physically in Scout custody for this product."""
  withScoutQty: Int!
  """Everything the campaign owns for this product and has not delivered: kernelPhysicalQty + withScoutQty."""
  totalUnitOwnedUndeliveredQty: Int!
}

"""A page of inventory positions."""
type InventoryPositionConnection {
  """The positions on this page."""
  items: [InventoryPosition!]!
  """Cursor state for this page."""
  pageInfo: PageInfo!
}

"""Append-only audit record of one inventory change (spec §5.8). Never edited: a correction is a new movement linked to the original."""
type InventoryMovement {
  """The movement's own ID."""
  movementId: ID!
  """The Unit Campaign whose balance moved."""
  unitCampaignId: ID!
  """The product whose balance moved."""
  productId: ID!
  """What kind of change this was."""
  movementType: InventoryMovementType!
  """Signed change to central physical Kernel stock; 0 when not applicable."""
  kernelPhysicalDelta: Int!
  """Signed change to We Owe-reserved central stock; 0 when not applicable."""
  soldPossessionDelta: Int!
  """Signed change to one Scout's custody; 0 when not applicable."""
  withScoutDelta: Int!
  """Explanation of an allocation change; allocations stay authoritative; 0 when not applicable."""
  assignedDelta: Int!
  """Signed change to the separate Council-on-order balance; 0 when not applicable."""
  councilOnOrderDelta: Int!
  """The Scout whose custody or individual fulfillment this is, when applicable."""
  profileId: ID
  """The Show & Sell event this movement belongs to, when applicable."""
  showAndSellId: ID
  """The sale this movement belongs to, when applicable."""
  saleId: ID
  """The individual Order this movement belongs to, when applicable."""
  orderId: ID
  """The We Owe obligation this movement belongs to, when applicable."""
  weOweId: ID
  """The fulfillment this movement belongs to, when applicable."""
  fulfillmentId: ID
  """The finalization this movement belongs to, when applicable."""
  finalizationId: ID
  """Why the change was made; mandatory for manual adjustments and reconciliation."""
  reason: String
  """The account that performed the action."""
  actorAccountId: ID!
  """Business moment of the change."""
  occurredAt: AWSDateTime!
  """The InventoryBalance version this movement produced, or null for a movement that changed no balance."""
  inventoryVersion: Int
  """The idempotency key of the request that wrote this movement."""
  idempotencyKey: String!
}

"""A page of inventory movements, newest first."""
type InventoryMovementConnection {
  """The movements on this page."""
  items: [InventoryMovement!]!
  """Cursor state for this page."""
  pageInfo: PageInfo!
}

"""Inclusive instant window for a history read; at most 366 days wide."""
input DateRangeFilter {
  """First instant to include."""
  startAt: AWSDateTime
  """Last instant to include; must be after startAt."""
  endAt: AWSDateTime
}

"""Input for recordInventoryReceipt. Stock only: no Order, payment, credit, or We Owe effect."""
input RecordInventoryReceiptInput {
  """The Unit Campaign receiving the stock."""
  unitCampaignId: ID!
  """The catalog product received; must be a product of this campaign's catalog."""
  productId: ID!
  """Positive number of Kernels received."""
  quantity: Int!
  """Business moment the stock arrived; defaults to now."""
  occurredAt: AWSDateTime
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for adjustInventory. Signed, never zero, and always explained."""
input AdjustInventoryInput {
  """The Unit Campaign whose stock is changing."""
  unitCampaignId: ID!
  """The product whose central Kernel stock is changing."""
  productId: ID!
  """Signed change to central physical stock; the result must keep kernelPhysicalQty >= soldInPossessionQty >= 0."""
  quantityDelta: Int!
  """Why the stock changed: miscount, damage, gift, trade. Mandatory."""
  reason: String!
  """Business moment of the change; defaults to now."""
  occurredAt: AWSDateTime
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for adjustCouncilOnOrder. Changes the separate on-order balance only, never Kernel stock."""
input AdjustCouncilOnOrderInput {
  """The Unit Campaign whose on-order balance is changing."""
  unitCampaignId: ID!
  """The product the Council has on order."""
  productId: ID!
  """Signed change to councilOnOrderQty; the result cannot be negative."""
  quantityDelta: Int!
  """Why the on-order expectation changed; optional."""
  reason: String
  """Business moment of the change; defaults to now."""
  occurredAt: AWSDateTime
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

# ============================================================================
# Show & Sell — Scout custody (delivery checklist §2.3, data model §5.9)
# ============================================================================

"""One Scout's custody of one product in one Unit Campaign: unsold unit-owned stock issued for individual sales. Stock with a Scout is not sellable Kernel stock until it is returned or consumed by a sale; it still counts in total unit-owned stock (spec CUST-01)."""
type ScoutCustodyBalance {
  """The Unit Campaign the custody belongs to."""
  unitCampaignId: ID!
  """The product the Scout holds."""
  productId: ID!
  """The Scout holding the stock."""
  profileId: ID!
  """The Scout Campaign used for this Scout's individual sales."""
  campaignId: ID!
  """Unsold unit-owned Kernels with this Scout; never negative."""
  withScoutQty: Int!
  """Custody version, incremented by every issue, sale, and return on this row."""
  version: Int!
  """When the custody row was created."""
  createdAt: AWSDateTime
  """When the custody row was last written."""
  updatedAt: AWSDateTime
}

"""A page of Scout custody balances, ordered by product then Scout. Carries the aggregate the inventory board needs alongside the per-Scout rows."""
type ScoutCustodyBalanceConnection {
  """The custody rows on this page."""
  items: [ScoutCustodyBalance!]!
  """Cursor state for this page."""
  pageInfo: PageInfo!
  """Total With Scout quantity across the whole filtered set, not just this page."""
  totalWithScoutQty: Int!
}

"""One product and how many Kernels of it it names."""
input ProductQuantityInput {
  """The product."""
  productId: ID!
  """Positive number of Kernels."""
  quantity: Int!
}

"""Input for issueStockToScout. Moves unassigned Kernel stock into one Scout's custody; never sells anything."""
input IssueStockToScoutInput {
  """The Unit Campaign issuing the stock."""
  unitCampaignId: ID!
  """The Scout Campaign of the roster identity being issued to; must match the roster row."""
  campaignId: ID!
  """The Scout's profile; must be an ACTIVE member of this campaign's roster."""
  profileId: ID!
  """The product being issued."""
  productId: ID!
  """Positive number of Kernels to issue; cannot exceed the unassigned stock."""
  quantity: Int!
  """Business moment of the issue; defaults to now."""
  occurredAt: AWSDateTime
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for returnStockFromScout. One atomic batch: every product returns or none does."""
input ReturnStockFromScoutInput {
  """The Unit Campaign taking the stock back."""
  unitCampaignId: ID!
  """The Scout Campaign the custody was issued under; must match the custody rows."""
  campaignId: ID!
  """The Scout returning the stock. A removed Scout's custody still returns."""
  profileId: ID!
  """Non-empty, at most one entry per product; the batch must fit the 90-action write plan."""
  items: [ProductQuantityInput!]!
  """Business moment of the return; defaults to now."""
  occurredAt: AWSDateTime
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""What one issue produced: the product's stock position and the Scout's custody."""
type IssueStockToScoutPayload {
  """The product's position after the issue: Kernel stock down, With Scout up."""
  inventoryPosition: InventoryPosition!
  """The Scout's custody row after the issue."""
  custodyBalance: ScoutCustodyBalance!
}

"""What one return batch produced, in the order the request named its products."""
type ReturnStockFromScoutPayload {
  """Each returned product's position, with Kernel stock back up."""
  inventoryPositions: [InventoryPosition!]!
  """Each returned product's custody row for that Scout."""
  custodyBalances: [ScoutCustodyBalance!]!
}

# === Show & Sell — individual Order fulfillment (delivery checklist §2.4, data model §5.19) ===
# Authorization lives in the resolver: Unit Admin for the Order's IMMUTABLE
# originating Unit, read off the Order row itself, never off a Unit id the caller
# supplies (AUTH-U). The Order's `fulfillmentVersion` is the serialization point
# for fulfill, reverse, and a line edit against one Order.

"""Input for fulfillIndividualOrderLine. Fills part or all of one individual Order line from a Kernel-chosen source."""
input FulfillIndividualOrderLineInput {
  """The Order whose line is fulfilled. Its own immutable Unit scope decides whose admin may act."""
  orderId: ID!
  """The stable line identity (§5.19). A pre-Wave-3 line carries no identity, so nothing can name it."""
  lineItemId: ID!
  """Kernels fulfilled on this line; cannot exceed the line's still-unfulfilled quantity."""
  quantity: Int!
  """KERNEL_STOCK consumes unassigned Kernel stock; EXTERNAL_COUNCIL consumes no Kernel stock at all. SCOUT_CUSTODY is consumed by the sale itself, so it is not a choice here."""
  source: OrderFulfillmentSource!
  """The Order.fulfillmentVersion this caller read. A stale value conflicts instead of double-fulfilling one line."""
  expectedFulfillmentVersion: Int!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for reverseIndividualOrderFulfillment. Undoes one fulfillment and returns only the stock source it took."""
input ReverseIndividualOrderFulfillmentInput {
  """The Order the fulfillment belongs to."""
  orderId: ID!
  """The FULFILL record to reverse. A REVERSAL cannot be reversed."""
  fulfillmentId: ID!
  """The Order.fulfillmentVersion this caller read."""
  expectedFulfillmentVersion: Int!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""What one fulfillment produced. `inventoryPosition` is absent exactly when the source moved no Kernel stock."""
type FulfillIndividualOrderLinePayload {
  """The Order after the fulfillment, with the line's fulfilledQuantity and fulfillmentVersion moved."""
  order: Order!
  """The append-only FULFILL record this request wrote."""
  fulfillment: OrderFulfillment!
  """The product's stock position, present only for a KERNEL_STOCK fulfillment."""
  inventoryPosition: InventoryPosition
}

"""What one reversal produced. `inventoryPosition` is absent exactly when the reversed source moved no Kernel stock."""
type ReverseIndividualOrderFulfillmentPayload {
  """The Order after the reversal, with the line's fulfilledQuantity back down and fulfillmentVersion moved."""
  order: Order!
  """The append-only REVERSAL record this request wrote, linked to the fulfillment it undoes."""
  reversal: OrderFulfillment!
  """The product's stock position, present only when the reversed source was KERNEL_STOCK."""
  inventoryPosition: InventoryPosition
}

"""One Order's full fulfillment and reversal audit history, oldest first."""
type OrderFulfillmentConnection {
  """The fulfillment and reversal records, with the administrative audit fields."""
  items: [OrderFulfillment!]!
  """Pagination state for this read."""
  pageInfo: PageInfo!
}

"""One individual Order in the projection a Unit Admin fulfills (§2.4, §5.19): the Order, the immutable Unit scope it was taken under, and each line's stable identity with its fulfilled quantity. Deliberately not the legacy `Order` shape - customer contact details are not part of administering stock, and this projection carries none of them."""
type UnitOrder {
  """The Order ID."""
  orderId: ID!
  """The Scout who took the Order."""
  profileId: ID!
  """The Scout Campaign the Order was placed under."""
  campaignId: ID!
  """The Unit that owns the stock: the origin captured at sale time (API-FIX-05)."""
  unitId: ID!
  """The Unit Campaign that is this Order's immutable origin."""
  unitCampaignId: ID!
  """The customer name the Scout recorded on the Order."""
  customerName: String!
  """Business moment of the Order."""
  orderDate: AWSDateTime!
  """Serialization version for fulfilling and reversing this Order's lines (§5.19). Rows written before Wave 3 carry no value, which reads as 0."""
  fulfillmentVersion: Int
  """The Order's lines, each with the identity a fulfillment names."""
  lineItems: [UnitOrderLine!]!
}

"""One line of a Unit-scope Order: what was ordered, the stable id a fulfillment names, and how much of it is already fulfilled."""
type UnitOrderLine {
  """The stable line identity (§5.19). A row written before stable line ids carries none, and such a line cannot be fulfilled by name."""
  lineItemId: ID
  """The product this line names."""
  productId: ID!
  """The product's name as the Order recorded it."""
  productName: String!
  """Kernels ordered on this line."""
  quantity: Int!
  """Kernels already fulfilled on this line. A row written before Wave 3 carries none, and is answered as 0."""
  fulfilledQuantity: Int!
}

"""A page of one Unit Campaign's individual Orders, newest first."""
type UnitOrderConnection {
  """The Orders on this page."""
  items: [UnitOrder!]!
  """Cursor state for this page."""
  pageInfo: PageInfo!
}

# ============================================================================
# Show & Sell and inventory — Stage 3.1: events, their lifecycle, and the
# participant-facing opportunity read (delivery checklist §3.1)
#
# One event is the aggregate everything else in a Show & Sell hangs from: the
# event row's `version` is what allocation, slot, signup, sale and finalization
# writes all condition on, which is why §3.1.4 keeps every event-aggregate write
# under one owner. Times are immutable after creation (spec SSE-07): the workflow
# for a wrong time is cancel-and-recreate, never reschedule, and there is no
# `RESCHEDULED` state. `status` answers where the event stands on the calendar
# AND what a workflow has done to it — `SCHEDULED`, `ACTIVE` and `ENDED` are read
# from the immutable interval, because nothing in this design advances a clock by
# writing a row, while `CANCELLED`, `FINALIZED` and `REOPENED` are the three
# states a mutation actually records (data model §9.1).
#
# The two halves of the read are deliberately different types. A Unit Admin sees
# `ShowAndSellAdmin` with allocations, slots, stock quantities, audit actors and
# the finalization pointers. A Scout sees `ShowAndSellOpportunity` — event facts,
# the slots and the room left in them, and their own signups — with no inventory,
# sale, buyer, cash, finalization or actor field anywhere on it (API contract
# SEC-04). The three participant types carry the `# participant-safe` marker so
# the schema guard keeps checking them as the surface grows.
#
# Same posture as Stages 1 and 2: every field is Cognito-authenticated at the
# schema boundary, no field is API-key or public, and Unit Admin / SellerProfile
# authorization lives in the resolver.
# ============================================================================

"""Where a Show & Sell event stands: the three calendar states read from the immutable interval, and the three a workflow records (data model §9.1). There is no rescheduled state, and an ended event is not a finalized one (spec SSE-04)."""
enum ShowAndSellStatus {
  """Before its startAt; cancellable by a Unit Admin."""
  SCHEDULED
  """Between startAt and endAt."""
  ACTIVE
  """At or after endAt, awaiting finalization."""
  ENDED
  """Cancelled before startAt by a Unit Admin; terminal, with its reason and actor stored."""
  CANCELLED
  """Credit approved against a finalization version."""
  FINALIZED
  """A finalized version suspended for correction; approved credit cleared, history preserved."""
  REOPENED
}

"""One event's reservation of one product's stock (data model §5.11). OPEN counts as assigned against the campaign balance; CANCELLED is an event cancellation and RELEASED is finalization, and both are terminal."""
enum AllocationStatus {
  """Still holding a reservation."""
  OPEN
  """Released by finalization."""
  RELEASED
  """Released by a pre-start event cancellation."""
  CANCELLED
}

"""A Scout's signup for one slot: ACTIVE holds a place and counts against capacity, CANCELLED is history that is never deleted (data model §9.3, spec SSE-05)."""
enum SignupStatus {
  """Holding a place in the slot."""
  ACTIVE
  """Cancelled; the row stays for history and reports."""
  CANCELLED
}

"""One event's reservation of one product: the quantities an admin sees, and the interval the overlap rule was decided on. `remainingQty` is stored rather than derived so no reader can compute a different answer than the write that maintained it."""
type ShowAndSellAllocation {
  """The Unit Campaign whose stock is reserved."""
  unitCampaignId: ID!
  """The catalog product reserved."""
  productId: ID!
  """The event holding the reservation."""
  showAndSellId: ID!
  """The event's start, denormalized onto the allocation for authoritative overlap checks."""
  startAt: AWSDateTime!
  """The event's end, denormalized onto the allocation for authoritative overlap checks."""
  endAt: AWSDateTime!
  """OPEN, RELEASED, or CANCELLED."""
  status: AllocationStatus!
  """Quantity reserved to this event."""
  allocatedQty: Int!
  """Quantity sold at this event."""
  soldQty: Int!
  """Quantity released back to the campaign by a cancellation or finalization."""
  releasedQty: Int!
  """Still unsold and unreleased."""
  remainingQty: Int!
  """Allocation version; every allocation write and the cancellation condition on it."""
  version: Int!
  """When the allocation was created."""
  createdAt: AWSDateTime
  """When the allocation was last written."""
  updatedAt: AWSDateTime
}

"""A page of raw allocation facts for one Unit Campaign (data query §6.2, DATA-Q-03). It carries rows and never a total: assigned, unassigned, and overage totals are the browser's arithmetic, over every page it fetched."""
type EventInventoryAllocationConnection {
  """The allocation rows on this page, ordered by product then event."""
  items: [ShowAndSellAllocation!]!
  """Cursor state for this page."""
  pageInfo: PageInfo!
}

"""One working slot of an event (data model §5.12): an arbitrary interval inside the event's immutable interval, a capacity, and the counter every signup write maintains transactionally."""
type ShowAndSellSlot {
  """The event this slot belongs to."""
  showAndSellId: ID!
  """The slot's stable ID."""
  slotId: ID!
  """Display label; absent when the Kernel never named the slot."""
  label: String
  """Slot start; never before the event's startAt."""
  startAt: AWSDateTime!
  """Slot end; never after the event's endAt, and always after its own startAt."""
  endAt: AWSDateTime!
  """Maximum active signups (1-100)."""
  capacity: Int!
  """Active signups now holding a place in this slot."""
  activeSignupCount: Int!
  """Slot version; signup, capacity and slot edits condition on it."""
  version: Int!
  """When the slot was created."""
  createdAt: AWSDateTime
  """When the slot was last written."""
  updatedAt: AWSDateTime
}

"""One Scout's signup for one slot, with its audit trail (data model §5.13). The actor fields are why this type is administrative: a Scout sees `ParticipantSignup` instead."""
type ShowAndSellSignup {
  """The event signed up for."""
  showAndSellId: ID!
  """The slot signed up for."""
  slotId: ID!
  """The Scout holding (or having held) the place."""
  profileId: ID!
  """The Unit Campaign whose roster and credit scope this signup belongs to."""
  unitCampaignId: ID!
  """The Scout's own Scout Campaign, kept for credit and Order identity."""
  campaignId: ID!
  """ACTIVE or CANCELLED."""
  status: SignupStatus!
  """Confirmed work minutes; 0 until a Kernel confirms the work, and setting it back to 0 un-confirms it."""
  actualMinutes: Int!
  """Account that placed the signup — the Scout's own WRITE Account or a Unit Admin."""
  signedUpByAccountId: ID!
  """Account that confirmed the work; null until it is confirmed."""
  confirmedByAccountId: ID
  """When the work was confirmed; null until it is."""
  confirmedAt: AWSDateTime
  """Signup version; work confirmation and cancellation condition on it."""
  version: Int!
  """When the signup was created."""
  createdAt: AWSDateTime
  """When the signup was last written."""
  updatedAt: AWSDateTime
}

"""A Show & Sell event as its Unit Admin manages it: identity, the immutable interval, the split and We Owe settings, the products it has ever held, its allocations and slots, its finalization pointers, and the audit of who wrote what."""
type ShowAndSellAdmin {
  """The event's stable ID; never derived from location or times."""
  showAndSellId: ID!
  """The owning Unit, read off the event rather than claimed by the caller."""
  unitId: ID!
  """The Unit Campaign this event belongs to; the scope of its stock, roster, and credit."""
  unitCampaignId: ID!
  """Required short name of where the event is."""
  locationName: String!
  """Optional address."""
  address: String
  """Event start; immutable after creation, so a wrong time is cancelled and recreated."""
  startAt: AWSDateTime!
  """Event end; immutable, and always after startAt."""
  endAt: AWSDateTime!
  """Where the event stands, combining the calendar and any workflow state written for it."""
  status: ShowAndSellStatus!
  """How earnings split: the Unit default inherited at creation, or this event's override."""
  splitMethod: SplitMethod!
  """Whether We Owe may be offered at this event; off unless a Kernel turns it on."""
  weOweEnabled: Boolean!
  """Every product this event has ever been allocated or sold, in the order they were added; no event-wide cap."""
  productIds: [ID!]!
  """This event's stock allocations, read authoritatively through `productIds` rather than through an index."""
  allocations: [ShowAndSellAllocation!]!
  """This event's working slots, soonest first."""
  slots: [ShowAndSellSlot!]!
  """The approved credit version, or null while credit is pending or the event is reopened."""
  approvedFinalizationId: ID
  """The most recent finalization version, for history."""
  latestFinalizationId: ID
  """Event version; every event-state write conditions on it, so a stale read cancels the write."""
  version: Int!
  """When the event was created."""
  createdAt: AWSDateTime!
  """When the event was last written."""
  updatedAt: AWSDateTime!
  """Account that created the event."""
  createdByAccountId: ID!
  """Account that last wrote the event."""
  updatedByAccountId: ID!
  """Account that cancelled the event; null unless it was cancelled."""
  cancelledByAccountId: ID
  """When the event was cancelled; null unless it was."""
  cancelledAt: AWSDateTime
  """The reason a Unit Admin gave when cancelling; null unless it was cancelled."""
  cancellationReason: String
}

"""A page of a Unit Campaign's events."""
type ShowAndSellAdminConnection {
  """The events on this page, soonest first."""
  items: [ShowAndSellAdmin!]!
  """Cursor state for this page."""
  pageInfo: PageInfo!
}

# participant-safe: what a Scout is offered, and nothing about the Unit's bookkeeping
"""One event as a Scout sees it: where and when it runs, whether We Owe is offered, how the pool splits, the slots with room left, and this Scout's own signups. It carries no inventory, sale, buyer, cash, finalization, actor, or tenancy field (API contract SEC-04), and it hands the browser no stock number to do arithmetic against."""
type ShowAndSellOpportunity {
  """The event on offer."""
  showAndSellId: ID!
  """Required short name of where the event is."""
  locationName: String!
  """Optional address."""
  address: String
  """Event start."""
  startAt: AWSDateTime!
  """Event end."""
  endAt: AWSDateTime!
  """Where the event stands; an ended or cancelled event is history, not an offer."""
  status: ShowAndSellStatus!
  """How earnings split among participants."""
  splitMethod: SplitMethod!
  """Whether We Owe may be offered at this event."""
  weOweEnabled: Boolean!
  """The Unit's IANA timezone, so the browser can render the interval in local time and build an ICS itself."""
  timezone: String!
  """The event version a signup or cancellation conditions on."""
  eventVersion: Int!
  """The event's slots, soonest first, with how many places each one still has."""
  slots: [ShowAndSellOpportunitySlot!]!
  """This Scout's signups for this event, cancelled ones included."""
  mySignups: [ParticipantSignup!]!
}

# participant-safe: a slot as an offer, not as a capacity record
"""One slot a Scout can choose: when it runs, what it is called, how many places it has, and how many are left. `openCapacity` is computed server-side so the browser cannot do its own arithmetic against a capacity it hopes for (SEC-05)."""
type ShowAndSellOpportunitySlot {
  """The slot's stable ID."""
  slotId: ID!
  """Display label; absent when the Kernel never named the slot."""
  label: String
  """Slot start."""
  startAt: AWSDateTime!
  """Slot end."""
  endAt: AWSDateTime!
  """Maximum active signups (1-100)."""
  capacity: Int!
  """Places still open, computed from the slot's own maintained counter."""
  openCapacity: Int!
}

"""A page of the events one Unit Campaign is offering to one caller's Scouts."""
type ShowAndSellOpportunityConnection {
  """The opportunities on this page, soonest first."""
  items: [ShowAndSellOpportunity!]!
  """Cursor state for this page."""
  pageInfo: PageInfo!
}

"""Input for createShowAndSell. The times are chosen here and never changed afterwards."""
input CreateShowAndSellInput {
  """The Unit Campaign the event belongs to; its admin creates the event."""
  unitCampaignId: ID!
  """Required short location name (1-100 trimmed characters)."""
  locationName: String!
  """Optional address (at most 500 characters)."""
  address: String
  """Event start (ISO 8601 UTC)."""
  startAt: AWSDateTime!
  """Event end (ISO 8601 UTC); must be after startAt. No assumed hour or half-hour."""
  endAt: AWSDateTime!
  """Split override for this event; omit to inherit the Unit's split default."""
  splitMethod: SplitMethod
  """Offer We Owe at this event; omitting it means off."""
  weOweEnabled: Boolean
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for updateShowAndSell. There is deliberately no startAt or endAt: rescheduling is not a feature, and a cancelled-and-recreated event keeps the audit of the one it replaces."""
input UpdateShowAndSellInput {
  """The event to edit."""
  showAndSellId: ID!
  """New location name; omit to leave it alone."""
  locationName: String
  """New address; send null to clear it, omit to leave it alone."""
  address: String
  """New split override for this event; omit to leave it alone."""
  splitMethod: SplitMethod
  """Turn We Owe on or off; refused when switching it off would strand an open We Owe obligation."""
  weOweEnabled: Boolean
  """The event version the caller last read (optimistic concurrency)."""
  version: VersionedInput!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for cancelShowAndSell. Legal only before startAt, and the reason is required: a state change that releases stock and cancels Scouts has to say why."""
input CancelShowAndSellInput {
  """The event to cancel."""
  showAndSellId: ID!
  """The event version the caller last read (optimistic concurrency)."""
  version: VersionedInput!
  """Why the event is being cancelled (1-500 trimmed characters)."""
  reason: String!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""What a cancellation did, in one coherent answer: the cancelled event, every allocation whose remainder went back on the shelf, and every signup it released."""
type CancelShowAndSellPayload {
  """The event, now cancelled, with its stored reason and actor."""
  event: ShowAndSellAdmin!
  """Allocations this cancellation cancelled, with the quantity released."""
  releasedAllocations: [ShowAndSellAllocation!]!
  """Signups this cancellation cancelled; their commitment projections were cancelled with them."""
  cancelledSignups: [ShowAndSellSignup!]!
}

"""One product's stock target for one event (checklist §3.2.1). A target, not a delta: the request says how many the event should hold, and the resolver works out what that changes."""
input AllocationTargetInput {
  """The catalog product being assigned; it must be a product of this campaign's catalog."""
  productId: ID!
  """How many the event should hold after this write (>= 0). Zero releases the remainder this event still holds."""
  quantity: Int!
}

"""Input for assignShowAndSellInventory. A batch is one atomic save: at most one target per product, no product-wide cap, and the batch is refused before any write when its computed plan could no longer be finalized (§8.10)."""
input AssignShowAndSellInventoryInput {
  """The event whose stock is being set."""
  showAndSellId: ID!
  """Non-empty, at most one entry per product. A product left out keeps whatever it already holds."""
  items: [AllocationTargetInput!]!
  """The event version the caller last read (optimistic concurrency)."""
  version: VersionedInput!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""A save that was allowed and said: the campaign holds less than its open allocations promise. Reported, never clamped, and never a refusal — a campaign may hold a morning and an afternoon event against the same four Kernels (spec ALLOC-03)."""
type AllocationWarning {
  """What the warning is: `SEQUENTIAL_OVER_ASSIGNMENT`."""
  code: String!
  """The product the warning is about."""
  productId: ID!
  """Sellable Kernel stock for that product right now."""
  currentStockQty: Int!
  """What every open allocation of this campaign holds for that product, this write included."""
  assignedQty: Int!
  """assignedQty - currentStockQty."""
  overageQty: Int!
  """The sentence for the tooltip, carrying the product, the stock, the assigned total, and the overage."""
  message: String!
}

"""What one assignment save did: the event's allocations, each product's position, and any over-assignment it is warning about (§6.2)."""
type AssignShowAndSellInventoryPayload {
  """This event's allocation rows after the write, for the products the event lists."""
  allocations: [ShowAndSellAllocation!]!
  """The position for each of those products, with the assigned/unassigned/overage quantities the save moved."""
  inventoryPositions: [InventoryPosition!]!
  """One warning per product whose open allocations now exceed sellable stock; empty when nothing is over-assigned."""
  warnings: [AllocationWarning!]!
}

"""Input for upsertShowAndSellSlot. A create names no slot and no slot version; an edit names both. Slot writes are allowed only while the event is scheduled (checklist §3.3.2)."""
input UpsertShowAndSellSlotInput {
  """The event whose slot board is being edited; the parent is part of the slot's key."""
  showAndSellId: ID!
  """The slot being edited; omit to add a slot whose id the server mints."""
  slotId: ID
  """Display label; null clears it, and a created slot simply has none."""
  label: String
  """Slot start (ISO 8601 UTC); never before the event's startAt."""
  startAt: AWSDateTime!
  """Slot end (ISO 8601 UTC); never after the event's endAt and always after its own startAt. Any duration — no hour or half-hour is assumed."""
  endAt: AWSDateTime!
  """Maximum active signups for this slot (1-100); never below the signups the slot already holds."""
  capacity: Int!
  """The event version the caller last read (optimistic concurrency)."""
  version: VersionedInput!
  """The slot version the caller last read; required when `slotId` names an existing slot, omitted when creating one."""
  slotVersion: VersionedInput
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for deleteShowAndSellSlot. Allowed only while the slot holds nobody, so a deletion can never silently drop a participant (checklist §3.3.3)."""
input DeleteShowAndSellSlotInput {
  """The event that owns the slot; a slot id from another event is not found here."""
  showAndSellId: ID!
  """The slot to delete."""
  slotId: ID!
  """The event version the caller last read (optimistic concurrency)."""
  version: VersionedInput!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

# ============================================================================
# Show & Sell and inventory — Stage 3.4: signups, work, and the read surfaces
# over them (delivery checklist §3.4)
#
# A signup is one Scout's place in one slot, and it is written as an aggregate:
# the signup row, its cross-campaign commitment projection, the slot's active
# counter, the Scout's commitment guard, and the event version all commit in one
# transaction (data model §5.13, sequence §3). Every denial — duplicate, capacity,
# overlapping times across any Unit Campaign, removed membership — is decided
# against those authoritative rows, never an index (SEC-06).
#
# The read split follows SEC-04. An admin sees `ShowAndSellSignup` with the full
# actor and confirmation audit; the Scout who holds the place sees
# `ParticipantSignup` / `ParticipantCommitment` with none of it. `signupVersion`
# is on the participant types because it is the caller's own concurrency token:
# `cancelShowAndSellSignup` conditions on it, and a Scout who cannot read it
# cannot cancel. `showAndSellSignupCalendarData` supplies the authorized facts a
# browser needs to build an ICS itself — data only; no server generates or
# stores a file (CAL-01/CAL-02, RPT-00).
# ============================================================================

"""Input for signupScoutForShowAndSellSlot. The Scout's identity arrives as the pair the roster keys on — the joined Scout Campaign and the SellerProfile — and both are consistency checks against the roster row, never the basis of access (§3.1 SEC-01)."""
input SignupShowAndSellSlotInput {
  """The event being signed up for; it must still be scheduled."""
  showAndSellId: ID!
  """The slot to take a place in."""
  slotId: ID!
  """The Scout Campaign whose roster membership carries the signup; it must be the Campaign joined to the event's Unit Campaign."""
  campaignId: ID!
  """The Scout taking the place."""
  profileId: ID!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""Input for cancelShowAndSellSignup. The version is the signup's own, which the participant reads back as `signupVersion` on its own signup or commitment."""
input CancelShowAndSellSignupInput {
  """The event the signup belongs to."""
  showAndSellId: ID!
  """The slot the Scout holds (or held)."""
  slotId: ID!
  """The Scout whose signup is being cancelled."""
  profileId: ID!
  """The signup version the caller last read (optimistic concurrency)."""
  version: VersionedInput!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

"""One Scout's confirmed work in one slot (checklist §3.4.3). `actualMinutes = 0` un-confirms; 1 through the slot's duration confirms."""
input ConfirmShowAndSellWorkLineInput {
  """The slot the work happened in."""
  slotId: ID!
  """The Scout who worked."""
  profileId: ID!
  """Minutes actually worked; 0 un-confirms the row."""
  actualMinutes: Int!
}

"""Input for confirmShowAndSellWork. One batch is one atomic save: 1-100 rows, unique (slotId, profileId) pairs, and the event version every prior read was taken against."""
input ConfirmShowAndSellWorkInput {
  """The event whose work is being confirmed."""
  showAndSellId: ID!
  """The work rows: unique Scout/slot pairs with their confirmed minutes."""
  work: [ConfirmShowAndSellWorkLineInput!]!
  """The event version the caller last read (optimistic concurrency)."""
  version: VersionedInput!
  """Idempotency for the mutation."""
  idempotency: IdempotencyInput!
}

# participant-safe: the Scout's own signup, without the audit of who placed or confirmed it
"""One signup as the Scout who holds it sees it: which slot, whether it is still active, how much work was confirmed, and the signup version `cancelShowAndSellSignup` conditions on. The actor fields are administrative and appear on `ShowAndSellSignup` instead."""
type ParticipantSignup {
  """The event signed up for."""
  showAndSellId: ID!
  """The slot signed up for."""
  slotId: ID!
  """When the slot runs."""
  startAt: AWSDateTime!
  """When the slot ends."""
  endAt: AWSDateTime!
  """ACTIVE or CANCELLED."""
  status: SignupStatus!
  """Confirmed work minutes; 0 means the work is not confirmed yet."""
  actualMinutes: Int!
  """The signup version; the caller's own cancellation conditions on it."""
  signupVersion: Int!
}

# participant-safe: one Scout's own commitment across every Unit Campaign
"""One commitment as the Scout who holds it sees it: the interval it blocks, the event it belongs to, and the signup version its cancellation conditions on. It carries no actor, no account, and no other Unit's bookkeeping — a cross-Unit commitment list must not disclose which Unit owns the other one (INV-Q-06). Confirmed work minutes are deliberately absent: they belong to the signup, and a Scout reads them on `ParticipantSignup`."""
type ParticipantCommitment {
  """The event the commitment belongs to."""
  showAndSellId: ID!
  """The slot the commitment was written for."""
  slotId: ID!
  """The interval's start, as the commitment projection stores it."""
  startAt: AWSDateTime!
  """The interval's end."""
  endAt: AWSDateTime!
  """ACTIVE or CANCELLED — only ACTIVE commitments block a new signup."""
  status: SignupStatus!
  """The signup version; the caller's own cancellation conditions on it."""
  signupVersion: Int!
}

"""A page of one Scout's commitments."""
type ParticipantCommitmentConnection {
  """The commitments on this page, soonest first."""
  items: [ParticipantCommitment!]!
  """Cursor state for this page."""
  pageInfo: PageInfo!
}

"""A page of an event's signups with their work and audit (checklist §3.4.4)."""
type ShowAndSellSignupConnection {
  """The signup rows on this page, by slot then Scout."""
  items: [ShowAndSellSignup!]!
  """Cursor state for this page."""
  pageInfo: PageInfo!
}

"""The pending work picture after a confirmation batch, computed and never approved: the minutes Kernels have confirmed and the minimum finalization write set that picture implies (§8.10). Approving credit is finalization's job, not this read's."""
type ShowAndSellWorkPreview {
  """The event version this preview was computed against, moved by this batch."""
  eventVersion: Int!
  """Confirmed minutes across the whole event, all Scouts summed."""
  totalConfirmedMinutes: Int!
  """Signup rows carrying confirmed work (actualMinutes > 0)."""
  confirmedWorkRows: Int!
  """Distinct Scouts behind those rows."""
  confirmedParticipants: Int!
  """The minimum actions finalization will need for this event's product and work set; the feasibility answer this same batch checks before it stages a write."""
  minimumFinalizationActions: Int!
}

"""What a confirmation batch did: the administrative signup rows it wrote, and the recomputed pending preview."""
type ConfirmShowAndSellWorkPayload {
  """The signup rows this batch confirmed or un-confirmed, with their full audit."""
  work: [ShowAndSellSignup!]!
  """The pending work picture across the event after this batch — computed, not approved."""
  preview: ShowAndSellWorkPreview!
}

# The authorized inputs an ICS needs, never an ICS: the browser assembles, serializes, and
# downloads the file itself (CAL-01, RPT-00). The identity fields are what make the ICS UID
# stable across downloads of the same signup, which is why they are answered even though
# nothing here is a report artifact.
"""The data one browser needs to generate a slot's calendar invite itself: stable identity for the Unit/Campaign/event/slot/signup, the location and address, the Unit's IANA timezone, and the slot's UTC interval. It contains no generated file, no download URL, and no notification."""
type CalendarInviteData {
  """The owning Unit; identity for the invite description."""
  unitId: ID!
  """The Unit's display name, for the description; absent when the Unit was never given one, in which case the caller composes its own label from the ids."""
  unitDisplayName: String
  """The Unit Campaign the event belongs to."""
  unitCampaignId: ID!
  """The Unit Campaign's name, for the description."""
  unitCampaignName: String!
  """The event."""
  showAndSellId: ID!
  """The slot; part of the stable UID identity."""
  slotId: ID!
  """The Scout holding the signup; part of the stable UID identity."""
  profileId: ID!
  """Display label; absent when the Kernel never named the slot."""
  slotLabel: String
  """Required short name of where the event is."""
  locationName: String!
  """Optional address."""
  address: String
  """The Unit's IANA timezone, so the browser converts the UTC interval to local time."""
  timezone: String!
  """Slot start, UTC."""
  slotStartAt: AWSDateTime!
  """Slot end, UTC; any duration — no hour or half-hour is assumed."""
  slotEndAt: AWSDateTime!
}

# ============================================================================
# Query Root
# ============================================================================

"""The root query object for the KernelWorx API."""
type Query {
  # Show & Sell — Units and Unit Campaigns (Stage 1)
  """The Units on which the caller holds a Unit Admin grant. No cross-Unit data."""
  myUnits(
    """Pagination parameters."""
    page: PageInput
  ): UnitConnection!
  """The unit's settings and admin count. Unit Admin for that Unit."""
  unit(
    """The Unit ID."""
    unitId: ID!
  ): Unit
  """The unit's admin grants; account email/name limited to administration needs. Unit Admin."""
  unitAdmins(
    """The Unit ID."""
    unitId: ID!
    """Pagination parameters."""
    page: PageInput
  ): UnitAccessGrantConnection!
  """The unit's active, unused invites; the code is returned only for them. Unit Admin."""
  unitInvites(
    """The Unit ID."""
    unitId: ID!
    """Pagination parameters."""
    page: PageInput
  ): UnitInviteConnection!
  """The Unit's payment methods: computed built-in Cash/Check/Other first, then custom methods. Unit Admin; at most 50 active custom methods."""
  unitPaymentMethods(
    """The Unit ID."""
    unitId: ID!
    """Include deactivated methods that history still references. Defaults to false."""
    includeInactive: Boolean = false
  ): [UnitPaymentMethod!]!
  """A short-lived pre-signed GET for one payment method's QR image, for browser embedding. Unit Admin only."""
  unitPaymentMethodQrDownloadUrl(
    """The Unit ID."""
    unitId: ID!
    """The method's stable paymentMethodId."""
    paymentMethodId: ID!
  ): UnitPaymentMethodQrDownload!
  """The member-safe preview of a campaign from its join code; any authenticated account. No inventory, roster, or grant data."""
  unitCampaignJoinInfo(
    """The campaign join code."""
    joinCode: String!
  ): UnitCampaignJoinPreview
  """The campaign's join code and settings. Unit Admin for the parent Unit."""
  unitCampaign(
    """The Unit Campaign ID."""
    unitCampaignId: ID!
  ): UnitCampaignAdmin
  """The campaign's catalog and product inputs for browser sales sheets. Unit Admin for the parent Unit."""
  unitCampaignCatalog(
    """The Unit Campaign ID."""
    unitCampaignId: ID!
  ): UnitCampaignCatalog
  """A Unit's campaigns. Unit Admin for the parent Unit."""
  unitCampaigns(
    """The parent Unit ID."""
    unitId: ID!
    """Filter by active state."""
    isActive: Boolean
    """Pagination parameters."""
    page: PageInput
  ): UnitCampaignConnection!
  """A Unit Campaign's roster, including removed history. Unit Admin for the parent Unit."""
  unitCampaignRoster(
    """The Unit Campaign ID."""
    unitCampaignId: ID!
    """Filter by roster status."""
    status: MembershipStatus
    """Pagination parameters."""
    page: PageInput
  ): UnitCampaignMembershipConnection!

  # Show & Sell — inventory balances and audit (Stage 2)
  """What a Unit Campaign holds per product, with the derived quantities computed server-side. Unit Admin for the parent Unit."""
  inventoryPositions(
    """The Unit Campaign ID."""
    unitCampaignId: ID!
    """Limit the page to these products (at most 15). Omit for every product the campaign has inventory rows for."""
    productIds: [ID!]
    """Pagination parameters."""
    page: PageInput
  ): InventoryPositionConnection!
  """One Unit Campaign's inventory movement history, newest first. Unit Admin for the parent Unit."""
  inventoryMovements(
    """The Unit Campaign ID."""
    unitCampaignId: ID!
    """Filter to one product's history."""
    productId: ID
    """Filter to one movement type."""
    movementType: InventoryMovementType
    """Filter to one Show & Sell event's movements."""
    showAndSellId: ID
    """Filter to one Scout's custody and fulfillment movements."""
    profileId: ID
    """Inclusive window of business moments; at most 366 days wide."""
    dateRange: DateRangeFilter
    """Pagination parameters."""
    page: PageInput
  ): InventoryMovementConnection!
  """What a Unit Campaign has out with its Scouts, per Scout and in aggregate. Unit Admin for the parent Unit."""
  scoutCustodyBalances(
    """The Unit Campaign ID."""
    unitCampaignId: ID!
    """Filter to one Scout's custody rows."""
    profileId: ID
    """Filter to one product's custody rows."""
    productId: ID
    """Pagination parameters."""
    page: PageInput
  ): ScoutCustodyBalanceConnection!
  """One Scout's own custody in one Unit Campaign. Profile Owner/WRITE/READ for that Scout, or Unit Admin for the parent Unit; never another Scout's rows."""
  myScoutCustody(
    """The Scout's profile ID."""
    profileId: ID!
    """The Unit Campaign ID."""
    unitCampaignId: ID!
  ): [ScoutCustodyBalance!]!
  """One Order's full fulfillment and reversal audit, oldest first, including who recorded each record and which inventory movement moved the stock. Unit Admin for the Order's immutable originating Unit; a participant reads the audit-free `Order.fulfillments` instead (§10.2)."""
  orderFulfillments(
    """The Order ID."""
    orderId: ID!
    """Pagination parameters."""
    page: PageInput
  ): OrderFulfillmentConnection!
  """The individual Orders one Scout Campaign holds for this Unit Campaign, newest first, in the projection a fulfillment write needs: origin scope, the stable line identity, each line's fulfilled quantity, and the version the next fulfillment conditions on. Unit Admin for the Unit Campaign, which is the Order's immutable origin; Orders another Unit took under the same Scout Campaign are not answered here, and no customer contact detail is."""
  unitScoutCampaignOrders(
    """The Unit Campaign whose admin is asking."""
    unitCampaignId: ID!
    """The Scout Campaign the Orders were placed under."""
    campaignId: ID!
    """Pagination parameters."""
    page: PageInput
  ): UnitOrderConnection!

  # Show & Sell — events and opportunities (checklist §3.1)
  """One event as its Unit Admin manages it: identity, immutable times, split and We Owe settings, allocations, slots, status, and the version the next write conditions on. Unit Admin for the event's Unit."""
  showAndSell(
    """The event ID."""
    showAndSellId: ID!
  ): ShowAndSellAdmin!
  """A Unit Campaign's events, soonest first, with optional state and date-window filters. Unit Admin for the campaign's Unit."""
  showAndSells(
    """The Unit Campaign whose events are being listed."""
    unitCampaignId: ID!
    """Filter to events in one state; the state compared is the one the answer reports, so a filter of `ENDED` matches an event whose interval has passed."""
    status: ShowAndSellStatus
    """Inclusive window on event start; at most 366 days wide."""
    dateRange: DateRangeFilter
    """Pagination parameters."""
    page: PageInput
  ): ShowAndSellAdminConnection!
  """The events one Unit Campaign is offering to the caller's own Scouts, soonest first, with the slots, the room left in them, and each Scout's signups. Profile Owner/WRITE or READ for a joined Scout; a Scout removed from the roster keeps visibility of what they already took part in and gains no new opportunity. No stock, sale, buyer, cash, or actor field is on this surface, and a Unit Admin uses `showAndSells` instead."""
  unitCampaignOpportunities(
    """The Unit Campaign whose events are being offered."""
    unitCampaignId: ID!
    """Include events that have already ended; omitting it means upcoming events only."""
    includePast: Boolean = false
    """Pagination parameters."""
    page: PageInput
  ): ShowAndSellOpportunityConnection!
  """One event's participant view for one Scout: the slots and that Scout's commitments. Profile Owner/WRITE or READ for that Scout, or a Unit Admin for the event's Unit. An unjoined Scout, another Unit's event, or a Scout the caller cannot read returns `NOT_FOUND`, and no administrative field is present."""
  showAndSellOpportunity(
    """The event ID."""
    showAndSellId: ID!
    """The Scout whose view is being read."""
    profileId: ID!
  ): ShowAndSellOpportunity!

  # Show & Sell — raw allocation facts (checklist §3.2.4, data query §6.2)
  """One Unit Campaign's allocation rows, product then event: the interval each was decided on, and allocated/sold/released/remaining quantities with the row's version. Raw facts only — no assigned/unassigned/overage total is computed here, because the browser fetches every page and adds them up itself (DATA-Q-03). Unit Admin for the campaign's Unit."""
  eventInventoryAllocations(
    """The Unit Campaign whose allocations are being read."""
    unitCampaignId: ID!
    """Filter to one product."""
    productId: ID
    """Filter to one event."""
    showAndSellId: ID
    """Filter to one allocation state."""
    status: AllocationStatus
    """Pagination parameters."""
    page: PageInput
  ): EventInventoryAllocationConnection!

  # Show & Sell — signup and commitment reads (checklist §3.4.4-§3.4.5)
  """An event's signups with the full actor and confirmation audit: who placed each, who confirmed the work, and the version each cancellation or confirmation conditions on. Unit Admin for the event's Unit."""
  showAndSellSignups(
    """The event whose signup board is being read."""
    showAndSellId: ID!
    """Filter to one signup state; omit for both, since cancelled rows are the history the audit keeps."""
    status: SignupStatus
    """Pagination parameters."""
    page: PageInput
  ): ShowAndSellSignupConnection!
  """One Scout's commitments across every Unit Campaign, soonest first, with no actor or account field. Profile READ/Owner/WRITE for that Scout; a Unit Admin must supply an authorized `unitId` and then sees only that Unit's commitments, so the endpoint is never a window onto another Unit's schedule (INV-Q-06)."""
  myScoutCommitments(
    """The Scout whose commitments are being read."""
    profileId: ID!
    """Restrict the answer to one Unit; required for, and restricted to, a Unit Admin calling as admin."""
    unitId: ID
    """Include cancelled commitments (history); omitting it means active commitments only."""
    includeCancelled: Boolean = false
    """Pagination parameters."""
    page: PageInput
  ): ParticipantCommitmentConnection!
  """The authorized facts one browser needs to generate a slot's calendar invite itself: identity, location, IANA timezone, and UTC times. Data only — no server generates, stores, or emails a file, and the READ-only collaborator's read surface stops short of it (CAL-01, AUTH-P-02). Unit Admin, or Profile Owner/WRITE for that exact Scout."""
  showAndSellSignupCalendarData(
    """The event."""
    showAndSellId: ID!
    """The slot."""
    slotId: ID!
    """The Scout holding the signup."""
    profileId: ID!
  ): CalendarInviteData!

  # Account queries
  """The authenticated caller's account. The row is created automatically on first read if it does not yet exist."""
  getMyAccount: Account!

  # Profile queries
  """Fetch a single seller profile by ID. Returns the profile if the caller owns it or has read access via a share, otherwise null."""
  getProfile(
    """The profile's ID."""
    profileId: ID!
  ): SellerProfile
  """List the seller profiles the caller owns, with pagination."""
  listMyProfiles(
    """Maximum number of items to return in the page."""
    limit: Int,
    """Opaque cursor from a previous page; omit to start from the first page."""
    nextToken: String
  ): SellerProfileConnection!
  """List seller profiles that have been shared to the caller, each annotated with the caller's permissions."""
  listMyShares: [SharedProfile!]!
  """Owner-facing settings for one campaign's public order surface. Owner-only on read and write."""
  getCampaignPublicOrderSettings(
    """The campaign's ID."""
    campaignId: ID!
  ): PublicOrderSettings @aws_cognito_user_pools

  # Campaign queries
  """Fetch a single campaign by ID. Returns the campaign if the caller has read access to its profile, otherwise null."""
  getCampaign(
    """The campaign's ID."""
    campaignId: ID!
  ): Campaign
  """List the campaigns on a profile, with pagination. The caller must have read access to the profile."""
  listCampaignsByProfile(
    """The profile's ID."""
    profileId: ID!,
    """Maximum number of items to return in the page."""
    limit: Int,
    """Opaque cursor from a previous page; omit to start from the first page."""
    nextToken: String
  ): CampaignConnection!

  # Catalog queries
  """Fetch a single catalog by ID. Returns the catalog only when it is public, admin-managed (ADMIN_MANAGED), or owned by the caller; returns null otherwise."""
  getCatalog(
    """The catalog's ID."""
    catalogId: ID!
  ): Catalog @aws_cognito_user_pools
  """List the public, admin-managed catalogs available to all users (soft-deleted catalogs excluded)."""
  listManagedCatalogs: [Catalog!]! @aws_cognito_user_pools
  """List the catalogs the caller has created (soft-deleted catalogs excluded)."""
  listMyCatalogs: [Catalog!]!
  """Return the IDs of every catalog used by a campaign the caller owns or has access to via a share."""
  listCatalogsInUse: [ID!]!

  # Order queries
  """Fetch a single order by ID. Returns the order if the caller has read access to its profile, otherwise null."""
  getOrder(
    """The order's ID."""
    orderId: ID!
  ): Order
  """List the orders in a campaign, with pagination. The caller must have read access to the campaign's profile."""
  listOrdersByCampaign(
    """The campaign's ID."""
    campaignId: ID!,
    """Maximum number of items to return in the page."""
    limit: Int,
    """Opaque cursor from a previous page; omit to start from the first page."""
    nextToken: String
  ): OrderConnection!

  # Public order queries (API key auth mode; the token argument is the authorization)
  """Fetch the public order page's offer: seller, campaign, catalog products, and allowed payment methods. A campaign that never enabled public orders, is disabled, or carries a token mismatch all return the same NOT_FOUND, so probing cannot distinguish them."""
  publicGetOrderOffer(
    """The campaign's ID in bare (unprefixed) form."""
    campaignId: ID!,
    """The share token from the public URL."""
    token: String!
  ): PublicOrderOffer! @aws_api_key
  """Fetch the buyer's receipt for a public order. Served to an API-key caller; the receipt token in the URL is the authorization. An unknown campaign/suffix, an absent or mismatched token, and a token that does not match the order all return the same NOT_FOUND."""
  publicGetOrderReceipt(
    """The campaign's ID in bare (unprefixed) form."""
    campaignId: ID!,
    """The order's suffix (the third and final segment of the order's full ID)."""
    orderSuffix: String!,
    """The receipt token from the receipt URL."""
    receiptToken: String!
  ): PublicOrderReceiptLookup! @aws_api_key

  # Share queries
  """List the shares (access grants) on a profile. The caller must have write access to the profile."""
  listSharesByProfile(
    """The profile's ID."""
    profileId: ID!
  ): [Share!]!
  """List the pending invites on a profile. Owner only: a caller whose write access comes from a share is not authorized to list invites and receives an empty list."""
  listInvitesByProfile(
    """The profile's ID."""
    profileId: ID!
  ): [ProfileInvite!]!

  # Shared campaign queries
  """Fetch a single shared campaign by its bearer code. Returns null when the code is unknown or the shared campaign is inactive."""
  getSharedCampaign(
    """The shared campaign's code."""
    sharedCampaignCode: String!
  ): SharedCampaign @aws_cognito_user_pools
  """List the active shared campaigns the caller has created, most recent first."""
  listMySharedCampaigns: [SharedCampaign!]!
  """Find active shared campaigns that exactly match the given unit and season (unitType, unitNumber, city, state, campaignName, and campaignYear). Inactive shared campaigns are excluded."""
  findSharedCampaigns(
    """The scout unit type."""
    unitType: String!,
    """The scout unit number."""
    unitNumber: Int!,
    """The city."""
    city: String!,
    """The state."""
    state: String!,
    """The campaign name to match (for example "Fall" or "Spring")."""
    campaignName: String!,
    """The campaign year to match (for example 2024)."""
    campaignYear: Int!
  ): [SharedCampaign!]!

  """Generate a unit-level sales report for a unit and season, covering only the sellers (profiles) the caller can read. catalogId is required so the report reflects a single catalog."""
  getUnitReport(
    """The scout unit type."""
    unitType: String!,
    """The scout unit number."""
    unitNumber: Int!,
    """The city, to identify the unit."""
    city: String,
    """The state, to identify the unit."""
    state: String,
    """The campaign name (for example "Fall" or "Spring")."""
    campaignName: String!,
    """The campaign year (for example 2024)."""
    campaignYear: Int!,
    """The catalog ID to build the report from."""
    catalogId: ID!
  ): UnitReport

  # Payment method queries
  """The payment methods available to the caller: the caller's stored custom methods plus the built-in "Cash" and "Check" methods, sorted by name."""
  myPaymentMethods: [PaymentMethod!]!
  """The payment methods stored for a profile's owner. The caller must have access to the profile; READ-only callers see the method names but not their QR codes (qrCodeUrl is null)."""
  paymentMethodsForProfile(
    """The profile's ID."""
    profileId: ID!
  ): [PaymentMethod!]!

  # Admin queries (requires the ADMIN Cognito group)
  """List all Cognito users, merged with their stored Account data, with pagination (admin only)."""
  adminListUsers(
    """Maximum number of users to return in the page."""
    limit: Int,
    """Opaque cursor from a previous page; omit to start from the first page."""
    nextToken: String
  ): AdminUserConnection!
  """Search users by email, name, or accountId (admin only)."""
  adminSearchUser(
    """The text to search for (matches email, display name, or account ID; at least 3 characters)."""
    query: String!
  ): [AdminUser!]!
  """List all seller profiles owned by the given account (admin only)."""
  adminGetUserProfiles(
    """The account ID to look up."""
    accountId: ID!
  ): [SellerProfile!]!
  """List all catalogs owned by the given account (admin only)."""
  adminGetUserCatalogs(
    """The account ID to look up."""
    accountId: ID!
  ): [Catalog!]!
  """List all campaigns owned by the given account (admin only)."""
  adminGetUserCampaigns(
    """The account ID to look up."""
    accountId: ID!
  ): [Campaign!]!
  """List all shared campaigns created by the given account (admin only)."""
  adminGetUserSharedCampaigns(
    """The account ID to look up."""
    accountId: ID!
  ): [SharedCampaign!]!
  """List all shares (access grants) on a profile (admin only)."""
  adminGetProfileShares(
    """The profile's ID."""
    profileId: ID!
  ): [Share!]!
}

# ============================================================================
# Mutation Root
# ============================================================================

"""The root mutation object for the KernelWorx API."""
type Mutation {
  # Show & Sell — Units and Unit Campaigns (Stage 1)
  """Create a unit; the caller becomes its initial Unit Admin. Returns the Unit and the creator grant."""
  createUnit(
    """The unit to create."""
    input: CreateUnitInput!
  ): CreateUnitPayload!
  """Update a unit's metadata and settings. Unit Admin for that Unit."""
  updateUnit(
    """The unit update."""
    input: UpdateUnitInput!
  ): Unit!
  """Generate a 16-character, 14-day, single-use unit admin invite. Unit Admin for that Unit."""
  createUnitInvite(
    """The invite to create."""
    input: CreateUnitInviteInput!
  ): UnitInvite!
  """Revoke an unused unit invite. Unit Admin for that Unit."""
  revokeUnitInvite(
    """The invite to revoke."""
    input: RevokeUnitInviteInput!
  ): Boolean!
  """Redeem a single-use, unexpired invite to become a Unit Admin. Any authenticated account."""
  redeemUnitInvite(
    """The invite to redeem."""
    input: RedeemUnitInviteInput!
  ): UnitAccessGrant!
  """Revoke a Unit Admin grant; the last grant returns CONFLICT. Unit Admin for that Unit."""
  revokeUnitAccessGrant(
    """The grant to revoke."""
    input: RevokeUnitAccessGrantInput!
  ): Unit!
  """Create a named Unit payment method. Unit Admin; Cash/Check/Other names reserved case-insensitively; at most 50 active custom methods."""
  createUnitPaymentMethod(
    """The payment method to create."""
    input: CreateUnitPaymentMethodInput!
  ): UnitPaymentMethod!
  """Rename a Unit payment method under its stable paymentMethodId. Unit Admin; historical sale snapshots keep the old name."""
  updateUnitPaymentMethod(
    """The rename."""
    input: UpdateUnitPaymentMethodInput!
  ): UnitPaymentMethod!
  """Deactivate a Unit payment method (soft deactivate only). Unit Admin; historical sales remain readable."""
  deactivateUnitPaymentMethod(
    """The deactivation."""
    input: DeactivateUnitPaymentMethodInput!
  ): UnitPaymentMethod!
  """Pre-sign a scoped S3 POST for one payment method's shared QR image. Unit Admin; PNG/JPEG/WebP up to 5 MB."""
  requestUnitPaymentMethodQrUpload(
    """The upload request."""
    input: RequestUnitPaymentMethodQrUploadInput!
  ): S3UploadInfo!
  """Attach an uploaded QR image to a Unit payment method. Unit Admin; validates the object exists and is the image its key claims."""
  confirmUnitPaymentMethodQrUpload(
    """The confirmation."""
    input: ConfirmUnitPaymentMethodQrUploadInput!
  ): UnitPaymentMethod!
  """Remove a Unit payment method's QR image and reference. Unit Admin; sale history is unchanged."""
  deleteUnitPaymentMethodQrCode(
    """The removal."""
    input: DeleteUnitPaymentMethodQrCodeInput!
  ): UnitPaymentMethod!
  """Create a Unit Campaign. Unit Admin for the parent Unit."""
  createUnitCampaign(
    """The campaign to create."""
    input: CreateUnitCampaignInput!
  ): UnitCampaignAdmin!
  """Update a Unit Campaign's name, year, and active state. Unit Admin for the parent Unit."""
  updateUnitCampaign(
    """The campaign update."""
    input: UpdateUnitCampaignInput!
  ): UnitCampaignAdmin!
  """Join a Unit Campaign with a join code. Any authenticated account with Owner or WRITE on the Scout."""
  joinUnitCampaign(
    """The join request."""
    input: JoinUnitCampaignInput!
  ): UnitCampaignMembership!
  """Remove a Scout from a Unit Campaign roster (sets REMOVED). Unit Admin for the parent Unit."""
  removeUnitCampaignMembership(
    """The removal request."""
    input: RemoveUnitCampaignMembershipInput!
  ): UnitCampaignMembership!

  # Show & Sell — inventory balances (Stage 2)
  """Receive stock for one catalog product. Unit Admin for the parent Unit; creates no Order, payment, credit, or We Owe obligation."""
  recordInventoryReceipt(
    """The receipt."""
    input: RecordInventoryReceiptInput!
  ): InventoryPosition!
  """Adjust a product's central Kernel stock by a signed amount, with a mandatory reason. Unit Admin for the parent Unit."""
  adjustInventory(
    """The adjustment."""
    input: AdjustInventoryInput!
  ): InventoryPosition!
  """Adjust the separate Council-on-order balance by a signed amount. Unit Admin for the parent Unit; never changes Kernel stock."""
  adjustCouncilOnOrder(
    """The on-order adjustment."""
    input: AdjustCouncilOnOrderInput!
  ): InventoryPosition!
  """Issue unassigned Kernel stock to an ACTIVE Scout on this campaign's roster. Unit Admin for the parent Unit; Kernel stock down, With Scout up, total unit-owned stock unchanged, and no Order, sale, credit, or We Owe effect."""
  issueStockToScout(
    """The issue."""
    input: IssueStockToScoutInput!
  ): IssueStockToScoutPayload!
  """Return one Scout's unsold custody to Kernel stock as one atomic batch: any over-return or oversized batch refuses the whole request. Unit Admin for the parent Unit."""
  returnStockFromScout(
    """The return batch."""
    input: ReturnStockFromScoutInput!
  ): ReturnStockFromScoutPayload!
  """Fulfill part or all of one individual Order line from Kernel stock or an external Council supply. Unit Admin for the Order's immutable originating Unit. Kernel stock is taken only for KERNEL_STOCK, and never more than the line still owes (§5.19)."""
  fulfillIndividualOrderLine(
    """The fulfillment."""
    input: FulfillIndividualOrderLineInput!
  ): FulfillIndividualOrderLinePayload!
  """Undo one fulfillment, restoring the line's unfulfilled quantity and only the stock source that fulfillment took. Unit Admin for the Order's immutable originating Unit. At most one reversal exists per fulfillment, and the deterministic key is what enforces it."""
  reverseIndividualOrderFulfillment(
    """The reversal."""
    input: ReverseIndividualOrderFulfillmentInput!
  ): ReverseIndividualOrderFulfillmentPayload!

  # Show & Sell — event lifecycle (checklist §3.1)
  """Create a Show & Sell event on a Unit Campaign: required location, optional address, immutable UTC interval, the Unit's split default or an override, and We Owe off unless turned on. Overlapping events are allowed. Unit Admin for the campaign's Unit."""
  createShowAndSell(
    """The event."""
    input: CreateShowAndSellInput!
  ): ShowAndSellAdmin!
  """Edit an event's location, address, split override, or We Owe setting. There is no time input: times are immutable, and the workflow for a wrong time is cancel-and-recreate. Allowed while scheduled, running, or ended, and as a draft while reopened; refused once finalized or cancelled, and refused when turning We Owe off would strand an open obligation. Unit Admin for the event's Unit."""
  updateShowAndSell(
    """The edit."""
    input: UpdateShowAndSellInput!
  ): ShowAndSellAdmin!
  """Cancel an event before it starts, in one atomic workflow: the event goes CANCELLED with its reason and actor, every open allocation is cancelled with its remainder released, signups and their commitment projections are cancelled, slot counters go to zero, and each Scout's commitment guard moves. An event that has started is finished by finalizing it, not by cancelling it. Unit Admin for the event's Unit."""
  cancelShowAndSell(
    """The cancellation."""
    input: CancelShowAndSellInput!
  ): CancelShowAndSellPayload!
  """Set how many Kernels a live event holds, per product, as one atomic save: the allocation rows, one movement each, the balance versions, the event's cumulative productIds, and the event version — while the event is reopened, only the admin's draft inputs, because a reopened event's stock answer belongs to re-finalization. A product left out keeps what it holds; a target of zero releases that product's remainder; what the event already sold is never taken back. Assigning more than the campaign holds at a shared instant is refused and writes nothing, and assigning more than it holds across events that never overlap saves with a warning naming the product, the stock, the assigned total, and the overage. Physical stock never moves. Unit Admin for the event's Unit."""
  assignShowAndSellInventory(
    """The assignment batch."""
    input: AssignShowAndSellInventoryInput!
  ): AssignShowAndSellInventoryPayload!

  # Show & Sell — slot board (checklist §3.3)
  """Add or edit one working slot of an event: an interval inside the event's immutable interval, an optional label, and a capacity of 1-100. Any duration is legal — no hour or half-hour is assumed. Allowed only while the event is scheduled, at most 20 slots per event, and an edit revalidates the signups the slot already holds: a capacity below the active count, or a new time that would put an already-signed-up Scout into overlap with another slot of this event or with a commitment at any other Show & Sell, is refused and writes nothing. The slot row and the event version commit together, so a caller holding a stale event version writes nothing. Unit Admin for the event's Unit."""
  upsertShowAndSellSlot(
    """The slot."""
    input: UpsertShowAndSellSlotInput!
  ): ShowAndSellSlot!
  """Delete one slot, only while it holds no active signup, so a deletion can never silently cancel a participant: their signups are cancelled by cancelling them. The parent id is part of the key, so a slot id from another event is not found. The delete and the event version it bumps commit together. Allowed only while the event is scheduled. Unit Admin for the event's Unit."""
  deleteShowAndSellSlot(
    """The deletion."""
    input: DeleteShowAndSellSlotInput!
  ): Boolean!

  # Show & Sell — signup and work mutations (checklist §3.4.1-§3.4.3)
  """Take a Scout's place in one slot of a scheduled event. The whole aggregate commits at once — signup, cross-campaign commitment projection, slot counter, the Scout's commitment guard, and the event version — so the row the next overlap check reads is never behind the signup it should block. Unit Admin of the event's Unit, or Owner/WRITE for that Scout; the Scout must hold ACTIVE membership of the event's Unit Campaign. A duplicate in the slot, a full slot, or a time that overlaps any commitment the Scout already holds — including at another Show & Sell — is refused and writes nothing (SLOT-02, SLOT-04)."""
  signupScoutForShowAndSellSlot(
    """The signup."""
    input: SignupShowAndSellSlotInput!
  ): ParticipantSignup!
  """Release a Scout's place: the signup and its commitment projection go CANCELLED, the slot's counter decrements, and the guard and event version move, all in one transaction. Owner/WRITE for the Scout may cancel while the event is scheduled; a Unit Admin may also correct records while the event is active, ended, or reopened, including after the Scout's membership was removed — historical cleanup deliberately does not require an ACTIVE roster row. A finalized event must be reopened first."""
  cancelShowAndSellSignup(
    """The cancellation."""
    input: CancelShowAndSellSignupInput!
  ): ParticipantSignup!
  """Confirm (or un-confirm) the work Kernel actually saw, one atomic batch of unique Scout/slot rows: `actualMinutes = 0` clears the confirmation and frees the finalization write set, 1 through the slot's duration confirms it. Allowed while the event is active, ended, or reopened; the batch preflights the event's minimum finalization write set so a confirmed board can never grow past what one transaction can finalize. Returns the administrative rows it wrote and the recomputed pending preview — computed, never approved credit."""
  confirmShowAndSellWork(
    """The confirmation batch."""
    input: ConfirmShowAndSellWorkInput!
  ): ConfirmShowAndSellWorkPayload!

  # Account mutations
  """Update profile fields on the caller's own account. At least one field must be provided. Returns the updated account."""
  updateMyAccount(
    """The fields to update."""
    input: UpdateMyAccountInput!
  ): Account!
  """Replace the caller's account preferences blob. Returns the updated account."""
  updateMyPreferences(
    """The new preferences value."""
    preferences: AWSJSON!
  ): Account!
  """Delete the caller's account and all associated data (profiles, campaigns, orders, shares, and invites; catalogs are preserved) and remove the user from Cognito. Returns true on success."""
  deleteMyAccount: Boolean!

  # Profile mutations
  """Create a new seller profile owned by the caller. Returns the created profile."""
  createSellerProfile(
    """The new profile's details."""
    input: CreateSellerProfileInput!
  ): SellerProfile!
  """Update a seller profile the caller owns. Returns the updated profile."""
  updateSellerProfile(
    """The profile ID and new details."""
    input: UpdateSellerProfileInput!
  ): SellerProfile!
  """Delete a seller profile the caller owns, along with all of its campaigns, orders, shares, and invites. Returns true on success."""
  deleteSellerProfile(
    """The profile's ID."""
    profileId: ID!
  ): Boolean!
  # Campaign mutations
  """Create a new active campaign on a profile the caller has write access to. Returns the created campaign."""
  createCampaign(
    """The new campaign's details."""
    input: CreateCampaignInput!
  ): Campaign!
  """Update a campaign on a profile the caller has write access to. Only provided fields change. Returns the updated campaign."""
  updateCampaign(
    """The campaign ID and fields to update."""
    input: UpdateCampaignInput!
  ): Campaign!
  """Delete a campaign and all of its orders, on a profile the caller has write access to. Returns true on success."""
  deleteCampaign(
    """The campaign's ID."""
    campaignId: ID!
  ): Boolean!
  """Enable, configure, or disable one campaign's public order surface. Owner only (share collaborators are FORBIDDEN). Enabling requires the campaign to be active, its catalog to exist and not be soft-deleted, and a non-empty method list, and re-requires the acknowledgements when the stored version is behind. Disabling keeps the share token so the URL stays stable; rotateToken mints a replacement."""
  updateCampaignPublicOrderSettings(
    """The campaign and the public-order settings to apply."""
    input: UpdateCampaignPublicOrderSettingsInput!
  ): PublicOrderSettings! @aws_cognito_user_pools

  # Public order mutations (API key auth mode; anonymous)
  """Place a public order on a campaign whose share token is in the request. Returns the buyer's receipt. A never-enabled campaign, a disabled campaign, and a bad token all return NOT_FOUND so probing cannot distinguish them; a campaign at its order cap returns PUBLIC_ORDER_LIMIT_EXCEEDED."""
  publicCreateOrder(
    """The anonymous order input, carrying the campaign's share token."""
    input: PublicCreateOrderInput!
  ): PublicOrderReceipt! @aws_api_key

  # Catalog mutations
  """Create a catalog owned by the caller. Returns the created catalog."""
  createCatalog(
    """The new catalog's details and products."""
    input: CreateCatalogInput!
  ): Catalog!
  """Update a catalog the caller owns, replacing its name, visibility, and products. Returns the updated catalog."""
  updateCatalog(
    """The catalog's ID."""
    catalogId: ID!,
    """The new catalog's details and products."""
    input: CreateCatalogInput!
  ): Catalog!
  """Soft-delete a catalog the caller owns (it is hidden from list queries but kept for reference). Returns true on success."""
  deleteCatalog(
    """The catalog's ID."""
    catalogId: ID!
  ): Boolean!

  # Order mutations
  """Place a new order in a campaign on a profile the caller has write access to. Returns the created order."""
  createOrder(
    """The new order's details."""
    input: CreateOrderInput!
  ): Order!
  """Update an order on a profile the caller has write access to. Only provided fields change. Returns the updated order."""
  updateOrder(
    """The order ID and fields to update."""
    input: UpdateOrderInput!
  ): Order!
  """Delete an order on a profile the caller has write access to. Returns true on success."""
  deleteOrder(
    """The order's ID."""
    orderId: ID!
  ): Boolean!


  # Shared campaign mutations
  """Create a shared campaign so other units can find and clone it. Returns the created shared campaign."""
  createSharedCampaign(
    """The new shared campaign's details."""
    input: CreateSharedCampaignInput!
  ): SharedCampaign!

  """Update a shared campaign the caller created. Only provided fields change. Returns the updated shared campaign."""
  updateSharedCampaign(
    """The shared campaign's code and fields to update."""
    input: UpdateSharedCampaignInput!
  ): SharedCampaign!

  """Delete a shared campaign the caller created. Returns true on success."""
  deleteSharedCampaign(
    """The shared campaign's code."""
    sharedCampaignCode: String!
  ): Boolean!

  # Sharing mutations
  """Create a redeemable invite to join a profile the caller owns. Returns the created invite."""
  createProfileInvite(
    """The new invite's details."""
    input: CreateProfileInviteInput!
  ): ProfileInvite!
  """Delete (revoke) an invite on a profile the caller owns. Returns true on success."""
  deleteProfileInvite(
    """The profile's ID."""
    profileId: ID!,
    """The invite's code."""
    inviteCode: ID!
  ): Boolean!
  """Redeem an invite code to grant the caller access to a profile. Returns the created share."""
  redeemProfileInvite(
    """The invite code to redeem."""
    input: RedeemProfileInviteInput!
  ): Share!
  """Share a profile the caller owns directly with another account by email. Returns the created share."""
  shareProfileDirect(
    """The profile, target email, and permissions."""
    input: ShareProfileDirectInput!
  ): Share!
  """Remove a share's access to a profile the caller owns. Returns true on success."""
  revokeShare(
    """The profile and account whose access should be revoked."""
    input: RevokeShareInput!
  ): Boolean!
  """Transfer a profile's ownership to an account that already has a share (the caller must be the owner or an admin). Returns the updated profile."""
  transferProfileOwnership(
    """The profile and the new owner's account ID."""
    input: TransferProfileOwnershipInput!
  ): SellerProfile!

  # Payment method mutations
  """Create a new payment method for the caller. The name must be unique and not a reserved name (Cash or Check). Returns the created payment method."""
  createPaymentMethod(
    """The new payment method's name."""
    name: String!
  ): PaymentMethod!
  """Rename one of the caller's payment methods. Returns the updated payment method."""
  updatePaymentMethod(
    """The current payment method's name."""
    currentName: String!,
    """The new name for the payment method."""
    newName: String!
  ): PaymentMethod!
  """Delete one of the caller's payment methods and its stored QR code. Returns true on success."""
  deletePaymentMethod(
    """The payment method's name."""
    name: String!
  ): Boolean!
  """Get pre-signed S3 credentials to upload a QR code for one of the caller's payment methods."""
  requestPaymentMethodQRCodeUpload(
    """The payment method's name."""
    paymentMethodName: String!
  ): S3UploadInfo!
  """Confirm a QR code upload for a payment method after the S3 upload completes. Returns the updated payment method."""
  confirmPaymentMethodQRCodeUpload(
    """The payment method's name."""
    paymentMethodName: String!,
    """The S3 key returned by requestPaymentMethodQRCodeUpload."""
    s3Key: String!
  ): PaymentMethod!
  """Delete the stored QR code for a payment method. Returns true on success."""
  deletePaymentMethodQRCode(
    """The payment method's name."""
    paymentMethodName: String!
  ): Boolean!

  # Admin mutations (requires the ADMIN Cognito group)
  """Send a password-reset email to a user by email (admin only). Returns true once the reset is initiated."""
  adminResetUserPassword(
    """The user's email address."""
    email: AWSEmail!
  ): Boolean!
  """Delete the account record and the Cognito user for an account whose per-entity data the caller has already deleted (admin only). The caller cannot purge their own account. Catalogs are never deleted. Returns true on success."""
  adminPurgeUserAccount(
    """The account ID to delete."""
    accountId: ID!
    """The profile IDs the caller read via adminGetUserProfiles before deleting the profile rows. The purge refuses with CONFLICT while any of them still exists, then sweeps the profile-keyed residue the browser cannot reach."""
    profileIds: [ID!]!
  ): Boolean!
  """Delete all orders across all campaigns of all profiles owned by the given account (admin only). Returns the number of orders deleted."""
  adminDeleteUserOrders(
    """The account ID to clean up."""
    accountId: ID!
  ): Int!
  """Delete all campaigns across all profiles owned by the given account (admin only). Returns the number of campaigns deleted."""
  adminDeleteUserCampaigns(
    """The account ID to clean up."""
    accountId: ID!
  ): Int!
  """Delete all shares across all profiles owned by the given account (admin only). Returns the number of shares deleted."""
  adminDeleteUserShares(
    """The account ID to clean up."""
    accountId: ID!
  ): Int!
  """Delete all profiles owned by the given account (admin only). Returns the number of profiles deleted."""
  adminDeleteUserProfiles(
    """The account ID to clean up."""
    accountId: ID!
  ): Int!
  """Delete a specific share, revoking that account's access to a profile (admin only). Returns true on success."""
  adminDeleteShare(
    """The profile's ID."""
    profileId: ID!,
    """The account whose access should be revoked."""
    targetAccountId: ID!
  ): Boolean!
  """Set or clear a campaign's sharedCampaignCode, associating it with a shared campaign (admin only). Returns the updated campaign."""
  adminUpdateCampaignSharedCode(
    """The campaign's ID."""
    campaignId: ID!,
    """The shared campaign's code to associate, or null to clear it."""
    sharedCampaignCode: String
  ): Campaign!
  """Create an admin-managed global catalog available to all users (admin only). Returns the created catalog."""
  createManagedCatalog(
    """The new catalog's details and products."""
    input: CreateCatalogInput!
  ): Catalog!
}

